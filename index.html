<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素の性質・特性クイズ v3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }
        .pop-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 3px solid #38bdf8;
        }
        .pop-btn {
            cursor: pointer !important;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 0 #0284c7;
        }
        .pop-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0284c7;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header style="width: 100%; max-width: 42rem; display: flex; align-items: center; justify-content: space-between; padding-bottom: 1rem;">
        <button onclick="changeScreen('top-screen')" id="home-btn" style="display: none;" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-yellow-300 rounded-xl border border-yellow-300 font-bold text-sm pop-btn">
            <i class="fa-solid fa-house mr-1"></i>トップに戻る
        </button>
        <div style="flex: 1; text-align: center;">
            <h1 class="text-xl md:text-2xl font-black text-yellow-300">🧪 元素の性質・特性クイズ 🧪</h1>
        </div>
        <div style="width: 80px;"></div>
    </header>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-2xl bg-slate-800 rounded-3xl p-6 md:p-8 pop-card space-y-6">

        <!-- 0. トップメニュー画面 -->
        <div id="top-screen" class="space-y-6 text-center">
            <h2 class="text-xl font-black text-white mb-6">モードを選んでね！（全118元素対応）</h2>
            
            <div class="space-y-4">
                <button type="button" onclick="startEndless()" class="pop-btn w-full p-5 bg-sky-400 hover:bg-sky-300 text-slate-900 font-black text-xl rounded-2xl border-2 border-white flex items-center justify-between text-left">
                    <div class="flex items-center space-x-4 pointer-events-none">
                        <i class="fa-solid fa-infinity text-3xl"></i>
                        <div>
                            <div>エンドレスモード</div>
                            <div class="text-xs text-slate-900 font-bold mt-1">118元素からランダム！3択（正解＋ランダムダミー2つ）</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right pointer-events-none"></i>
                </button>

                <button type="button" onclick="startTest()" class="pop-btn w-full p-5 bg-purple-400 hover:bg-purple-300 text-slate-900 font-black text-xl rounded-2xl border-2 border-white flex items-center justify-between text-left">
                    <div class="flex items-center space-x-4 pointer-events-none">
                        <i class="fa-solid fa-award text-3xl"></i>
                        <div>
                            <div>10問テストモード</div>
                            <div class="text-xs text-slate-900 font-bold mt-1">重複なしで10問出題！最後にまとめて解説レポート</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right pointer-events-none"></i>
                </button>
            </div>
        </div>

        <!-- 1. エンドレスモードプレイ画面 -->
        <div id="endless-screen" style="display: none;" class="space-y-6">
            <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-700">
                <span class="text-base font-black text-yellow-300"><i class="fa-solid fa-infinity mr-1"></i>エンドレスモード</span>
                <span class="text-sm font-bold text-green-400">せいかい数: <span id="endless-score" class="text-lg font-black">0</span>問</span>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700">
                <p id="endless-q-text" class="text-lg font-bold text-white leading-relaxed">ここに問題文が入ります。</p>
            </div>

            <div id="endless-options" class="space-y-3"></div>

            <!-- 解説エリア -->
            <div id="endless-explanation-box" style="display: none;" class="bg-slate-950 p-5 rounded-2xl border-2 border-yellow-300 space-y-4">
                <div id="endless-result-badge" class="text-xl font-black"></div>
                <p id="endless-exp-text" class="text-sm text-slate-200 font-bold leading-relaxed"></p>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="loadNextEndlessQuestion()" class="pop-btn flex-1 py-3 bg-yellow-300 text-slate-900 font-black rounded-xl border border-white">
                        次の問題へ <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                    <button type="button" onclick="changeScreen('top-screen')" class="pop-btn px-5 py-3 bg-slate-700 text-white font-bold rounded-xl border border-slate-500">
                        Topに戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. テストモードプレイ画面 -->
        <div id="test-play-screen" style="display: none;" class="space-y-6">
            <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-700">
                <span class="text-base font-black text-yellow-300"><i class="fa-solid fa-award mr-1"></i>10問テストモード</span>
                <span class="text-sm font-bold text-slate-300">問題 <span id="test-q-num">1</span>/10</span>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700">
                <p id="test-question-text" class="text-lg font-bold text-white leading-relaxed">ここに問題文が入ります。</p>
            </div>

            <div id="test-options-container" class="space-y-3"></div>
        </div>

        <!-- 3. テスト結果＆こたえあわせ画面 -->
        <div id="result-screen" style="display: none;" class="space-y-6 text-center">
            <h2 class="text-2xl font-black text-yellow-300">🎉 テスト終了！ 🎉</h2>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 space-y-2">
                <p class="text-slate-400 font-bold">あなたのスコア</p>
                <p id="final-score" class="text-5xl font-black text-green-400">0 点</p>
                <p id="final-comment" class="text-xs text-sky-400 font-bold pt-1"></p>
            </div>

            <div class="space-y-3 text-left">
                <h3 class="text-base font-black text-white border-b border-slate-700 pb-2">
                    <i class="fa-solid fa-clipboard-list text-yellow-300 mr-2"></i>こたえあわせ（解説レポート）
                </h3>
                <div id="test-review-list" class="space-y-3 max-h-80 overflow-y-auto pr-2"></div>
            </div>

            <button type="button" onclick="changeScreen('top-screen')" class="pop-btn w-full py-4 bg-yellow-300 text-slate-900 font-black text-lg rounded-2xl border-2 border-white">
                <i class="fa-solid fa-house mr-2"></i>トップに戻る
            </button>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center text-xs text-slate-500 font-bold pb-2">
        kmj
    </footer>

    <script>
        // 1〜118元素すべての性質・特性データベース
        const elementQuestions = [
            { q: "水素(H)の性質・特性として正しいものはどれ？", correct: "火をつけると激しく燃える", dummies: ["常温で液体である", "磁石に強く引きつけられる", "水よりも重い固体である", "電気をピカピカよく通す金属である", "強い放射線を出す"], explanation: "水素は火をつけると激しく燃え、『水素爆発』を起こすことも。宇宙で最も多く存在する最も軽い元素です。" },
            { q: "ヘリウム(He)の性質・特性として正しいものはどれ？", correct: "吸い込むと声が高くなる", dummies: ["強い毒性がある", "水に溶かすと強い酸性になる", "常温で気体の金属である", "空気に触れると爆発する", "磁石にくっつく"], explanation: "ヘリウムは非常に軽く不燃性の気体で、吸い込むと声が高くなります。宇宙では水素の次に多い元素です。" },
            { q: "リチウム(Li)の性質・特性として正しいものはどれ？", correct: "実用金属の中で最も軽く、バッテリーに使われる", "ダイヤモンドより硬い", "常温で気体である", "水よりも重い", "特有の甘いにおいを持つ"], explanation: "リチウムはすべての金属の中で最も密度が小さく非常に軽いため、スマホなどのリチウムイオン電池に欠かせません。" },
            { q: "ベリリウム(Be)の性質・特性として正しいものはどれ？", correct: "X線をよく通す性質があり、窓材に使われる", "水に触れると爆発する", "磁石にくっつく", "常温で液体である", "甘い香りがする液体"], explanation: "ベリリウムはX線を透過しやすい特性があり、医療用や工業用のX線装置の窓材などに利用されます。" },
            { q: "ホウ素(B)の性質・特性として正しいものはどれ？", correct: "ガラスの原料や、中性子を吸収する性質がある", "電気をピカピカよく通す金属である", "常温で液体である", "空気中で自然発火する", "水に浮くほど軽い"], explanation: "ホウ素は半導体のドープ剤や耐熱ガラス（ホウケイ酸ガラス）、原子炉の制御棒などに使われます。" },
            { q: "炭素(C)の性質・特性として正しいものはどれ？", correct: "ダイヤモンドや黒鉛（鉛筆の芯）と同じ元素である", "金属の一種である", "常温で気体である", "水と激しく反応する", "強い放射性を持つ"], explanation: "炭素は全く見た目が異なるダイヤモンドや黒鉛などの多様な姿（同素体）をとることで知られています。" },
            { q: "窒素(N)の性質・特性として正しいものはどれ？", correct: "空気の約78%を占め、反応性に乏しい", "火をつけると激しく燃える", "強い毒性を持つ", "常温で固体の金属である", "水に溶けて緑色になる"], explanation: "窒素は地球の大蔵の大部分を占め、化学的におとなしく他の物質と反応しにくい不活性な気体です。" },
            { q: "酸素(O)の性質・特性として正しいものはどれ？", correct: "ものが燃えるのを助ける働きがある", "無色ではなく緑色の気体である", "水よりも重い固体である", "磁石に引きつけられる", "常温で液体である"], explanation: "酸素は他の物質が燃えるのを助ける助燃性を持ち、生物の呼吸にも不可欠な重要な元素です。" },
            { q: "フッ素(F)の性質・特性として正しいものはどれ？", correct: "非常に反応性が高く、あらゆる物質を侵す", "金よりも輝く美しい金属である", "水に溶けると甘い味がする", "常温で安定な気体である", "電気を通さない"], explanation: "フッ素は全元素の中でトップクラスに強い酸化力と反応性を持ち、フッ素樹脂などに利用されます。" },
            { q: "ネオン(Ne)の性質・特性として正しいものはどれ？", correct: "放電すると赤橙色に光り、ネオンサインに使われる", "常温で固体の金属である", "特有の甘いにおいを持つ", "水に溶けると強酸になる", "非常に軽い気体の金属"], explanation: "ネオンは希ガスのひとつで、ガラス管に入れて電気を通すと鮮やかな赤橙色（ネオン管）に光ります。" },
            { q: "ナトリウム(Na)の性質・特性として正しいものはどれ？", correct: "水と激しく反応するため石油中で保存される", "ダイヤモンドより硬い鉱物である", "空気中では全く反応しない", "常温で気体である", "磁石にくっつく"], explanation: "ナトリウムは非常に柔らかい金属で、水と触れると激しく発熱・反応するため灯油などの中で保存されます。" },
            { q: "マグネシウム(Mg)の性質・特性として正しいものはどれ？", correct: "燃やすと強い白色光を放つ", "常温で液体である", "磁石に強く引きつけられる", "水に溶けると酸性になる", "空中で自然発火しない"], explanation: "マグネシウムは軽量で実用性が高く、燃焼させるとまばゆい強い白色光を放つため花火や照明弾に使われます。" },
            { q: "アルミニウム(Al)の性質・特性として正しいものはどれ？", correct: "軽くて加工しやすく、一円玉や缶に使われる", "金よりも重い貴金属である", "水に溶かすと強い酸性になる", "常温で気体である", "磁石に強く引きつけられる"], explanation: "アルミニウムは軽くて錆びにくく加工が簡単なため、アルミ缶や一円硬貨、航空機材などに広く使われています。" },
            { q: "ケイ素(Si)の性質・特性として正しいものはどれ？", correct: "半導体の材料としてコンピュータ等に不可欠である", "常温で液体である", "空気中で自然発火する", "水に浮く軽い金属", "強い放射線を出す"], explanation: "ケイ素は代表的な半導体元素であり、ICチップや太陽光パネルなど現代のIT社会を支える根幹です。" },
            { q: "リン(P)の性質・特性として正しいものはどれ？", correct: "黄リンは空気中で自然発火するほど反応性が高い", "磁石に強く引きつけられる金属である", "地球上で最も重い元素である", "常温で気体である", "水に溶けると甘い"], explanation: "リンにはいくつかの同素体があり、黄リンは空気中で自然発火するため水中保存され、赤リンはマッチ箱の側面等に使われます。" },
            { q: "硫黄(S)の性質・特性として正しいものはどれ？", correct: "黄色い粉末で、温泉のにおい（硫化水素など）の元になる", "常温で液体である", "電気を非常によく通す金属である", "水に浮くほど軽い", "強い放射性を持つ"], explanation: "硫黄は特徴的な黄色い固体で、火薬やゴムの加硫、温泉成分としてもおなじみの元素です。" },
            { q: "塩素(Cl)の性質・特性として正しいものはどれ？", correct: "黄緑色の有毒な気体で、プールの消毒に使われる", "甘い香りがする無色の液体である", "常温でピカピカ光る金属である", "水より軽い気体", "磁石にくっつく"], explanation: "塩素は刺激臭と強い殺菌力を持つ黄緑色の気体で、水道水の浄化やプールの消毒、塩の成分としても重要です。" },
            { q: "アルゴン(Ar)の性質・特性として正しいものはどれ？", correct: "空気中に約1%含まれる不活性な気体", "燃えやすい危険な気体", "常温で青色の液体", "水に溶けると強酸になる", "非常に重い金属"], explanation: "アルゴンは地球の空気に約0.93%含まれる希ガスで、溶接時のシールドガスなどに広く使われています。" },
            { q: "カリウム(K)の性質・特性として正しいものはどれ？", correct: "水と激しく反応し、炎色反応で紫色を示す", "ダイヤモンドより硬い", "磁石にくっつく", "常温で気体である", "水に溶けない石"], explanation: "カリウムはアルカリ金属で水と激しく反応し、炎色反応では美しい紫色を呈します。肥料の三要素の一つです。" },
            { q: "カルシウム(Ca)の性質・特性として正しいものはどれ？", correct: "骨や歯の成分であり、水と反応して水素を出す", "常温で液体である", "金よりも高価な貴金属である", "気体の非金属", "磁石に強く引きつけられる"], explanation: "カルシウムは生体の骨格を形作る重要な金属元素であり、水と緩やかに反応して水素ガスを発生させます。" },
            { q: "スカンジウム(Sc)の性質・特性として正しいものはどれ？", correct: "アルミニウムと合金にして軽量高強度な材料にする", "放射線を出すだけの危険な物質", "水に溶けて緑色になる", "常温で気体である", "非常に柔らかい金属"], explanation: "スカンジウムはアルミニウムに添加することで、航空宇宙用などの軽量で頑丈な特殊合金を作ることができます。" },
            { q: "チタン(Ti)の性質・特性として正しいものはどれ？", correct: "軽くて強く錆びにくいので医療や航空機に使われる", "非常に柔らかい金属", "水に溶けやすい", "常温で気体である", "磁石にくっつく"], explanation: "チタンは比強度が高く（軽くて頑丈）、耐食性に優れているため、人工関節や航空機、スポーツ用品に重宝されます。" },
            { q: "バナジウム(V)の性質・特性として正しいものはどれ？", correct: "鋼に混ぜて強靭な合金（バナジウム鋼）を作る", "常温で液体である", "空気に触れると爆発する", "水に浮く", "非常に柔らかい"], explanation: "バナジウムは鋼に添加することで、耐摩耗性や強度が飛躍的に高まるため工具やエンジン部品に使われます。" },
            { q: "クロム(Cr)の性質・特性として正しいものはどれ？", correct: "ピカピカ光るメッキに使われ、錆びを防ぐ", "水に溶けると赤くなる", "非常に柔らかい金属", "常温で気体である", "水よりも軽い"], explanation: "クロムは耐食性が高く美しい金属光沢を持つため、自動車部品などのクロムメッキやステンレス鋼の原料になります。" },
            { q: "マンガン(Mn)の性質・特性として正しいものはどれ？", correct: "乾電池の原料や、鉄の強度を高めるために使われる", "常温で気体である", "金色の美しい金属", "水に溶けると爆発する", "非常に柔らかい"], explanation: "マンガンは乾電池（マンガン乾電池）の二酸化マンガンや、製鉄時の脱酸・強度向上用合金として重要です。" },
            { q: "鉄(Fe)の性質・特性として正しいものはどれ？", correct: "磁石に引きつけられ、建造物や機械に欠かせない", "水に浮くほど軽い", "常温で液体である", "空気中で自然発火する", "全く錆びない金属"], explanation: "鉄はもっとも広く使われる実用金属で、磁性があり加工しやすく、現代文明を支える基盤となっています。" },
            { q: "コバルト(Co)の性質・特性として正しいものはどれ？", correct: "強力な磁石の材料や青色の顔料（コバルトブルー）になる", "常温で気体である", "水と激しく爆発する", "水に浮く金属", "非常に柔らかい"], explanation: "コバルトは強力な永久磁石の原料や、陶磁器などを鮮やかな青色に染めるコバルトブルーの顔料に使われます。" },
            { q: "ニッケル(Ni)の性質・特性として正しいものはどれ？", correct: "錆びにくく、硬貨（五百円玉など）の材料に使われる", "常温で液体である", "水に溶けると緑色になる", "空気中で爆発する", "非常に柔らかい"], explanation: "ニッケルは耐食性に優れ、ステンレスや五百円硬貨などの白銅貨の材料、電池の電極などに使われます。" },
            { q: "銅(Cu)の性質・特性として正しいものはどれ？", correct: "赤褐色で、電気や熱を非常によく伝える", "銀白色で空気中で爆発する", "水に浮く", "常温で気体である", "磁石に強く引きつけられる"], explanation: "銅は美しい赤褐色で、電気伝導性が高いため電線や電子基板、10円硬貨などに広く利用されています。" },
            { q: "亜鉛(Zn)の性質・特性として正しいものはどれ？", correct: "鉄のトタン板の錆び止め（亜鉛めっき）に使われる", "常温で液体である", "金よりも高価である", "水と激しく反応して爆発する", "気体の非金属"], explanation: "亜鉛は鉄の腐食を防ぐための表面処理（亜鉛めっき、トタン）や乾電池の負極などに利用されます。" },
            { q: "ガリウム(Ga)の性質・特性として正しいものはどれ？", correct: "手のひらの体温（約30度）で溶けるほど融点低め", "常温で気体である", "激しく水と反応する", "磁石にくっつく金属", "非常に硬い鉱物"], explanation: "ガリウムは約29.8℃で液体になるため、手のひらに乗せると体温でスルスルと溶け出すユニークな金属です。" },
