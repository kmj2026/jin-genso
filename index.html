<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素の性質・特性クイズ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            width: 100%;
            max-width: 42rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1rem;
        }
        main {
            width: 100%;
            max-width: 42rem;
            background-color: #1e293b;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 3px solid #38bdf8;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fde047;
            margin: 0;
            text-align: center;
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .pop-btn {
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 0 #0284c7;
            border: 2px solid #ffffff;
            width: 100%;
            padding: 1.25rem;
            border-radius: 1rem;
            font-weight: 900;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            margin-bottom: 1rem;
        }
        .pop-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0284c7;
        }
        .btn-sky {
            background-color: #38bdf8;
            color: #0f172a;
        }
        .btn-purple {
            background-color: #c084fc;
            color: #0f172a;
            box-shadow: 0 4px 0 #9333ea;
        }
        .btn-purple:active {
            box-shadow: 0 0 0 #9333ea;
        }
        .option-btn {
            cursor: pointer;
            touch-action: manipulation;
            width: 100%;
            text-align: left;
            padding: 1rem;
            background-color: #0f172a;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            transition: background-color 0.2s;
            line-height: 1.4;
        }
        .option-btn:hover {
            background-color: #334155;
        }
        .opt-badge {
            background-color: #fde047;
            color: #0f172a;
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        .status-box {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }
        .primary-action-btn {
            cursor: pointer;
            width: 100%;
            padding: 1rem;
            background-color: #fde047;
            color: #0f172a;
            font-weight: 900;
            font-size: 1.1rem;
            border-radius: 1rem;
            border: 2px solid #ffffff;
            text-align: center;
            box-shadow: 0 4px 0 #ca8a04;
        }
        .primary-action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ca8a04;
        }
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: bold;
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <button type="button" onclick="changeScreen('top-screen')" id="home-btn" style="display: none; padding: 0.5rem 1rem; background-color: #1e293b; color: #fde047; border-radius: 0.75rem; border: 1px solid #fde047; font-weight: bold; font-size: 0.875rem; cursor: pointer;">
            <i class="fa-solid fa-house mr-1"></i>トップに戻る
        </button>
        <div style="flex: 1; text-align: center;">
            <h1>🧪 元素クイズ 🧪</h1>
        </div>
        <div style="width: 80px;"></div>
    </header>

    <!-- メインコンテンツ -->
    <main>

        <!-- 0. トップメニュー画面 -->
        <div id="top-screen">
            <h2>モードを選んでね！（全118元素対応）</h2>
            
            <div>
                <button type="button" onclick="startEndless()" class="pop-btn btn-sky">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <i class="fa-solid fa-infinity" style="font-size: 1.8rem;"></i>
                        <div>
                            <div>エンドレスモード</div>
                            <div style="font-size: 0.75rem; font-weight: bold; margin-top: 0.25rem; color: #0f172a;">118元素からランダム！3択クイズ</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <button type="button" onclick="startTest()" class="pop-btn btn-purple">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <i class="fa-solid fa-award" style="font-size: 1.8rem;"></i>
                        <div>
                            <div>10問テストモード</div>
                            <div style="font-size: 0.75rem; font-weight: bold; margin-top: 0.25rem; color: #0f172a;">重複なしで10問！最後に解説レポート</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- 1. エンドレスモードプレイ画面 -->
        <div id="endless-screen" style="display: none;">
            <div class="status-box">
                <span style="color: #fde047;"><i class="fa-solid fa-infinity"></i> エンドレス</span>
                <span style="color: #4ade80;">正解数: <span id="endless-score" style="font-size: 1.2rem;">0</span>問</span>
            </div>

            <div style="background-color: #0f172a; padding: 1.5rem; border-radius: 1rem; border: 1px solid #475569; margin-bottom: 1.5rem;">
                <p id="endless-q-text" style="font-size: 1.1rem; font-weight: bold; margin: 0; line-height: 1.6;"></p>
            </div>

            <div id="endless-options"></div>

            <div id="endless-explanation-box" style="display: none; background-color: #020617; padding: 1.25rem; border-radius: 1rem; border: 2px solid #fde047; margin-top: 1.5rem;">
                <div id="endless-result-badge" style="font-size: 1.2rem; font-weight: 900; margin-bottom: 0.75rem;"></div>
                <p id="endless-exp-text" style="font-size: 0.9rem; color: #e2e8f0; font-weight: bold; margin-bottom: 1rem; line-height: 1.5;"></p>
                <div style="display: flex; gap: 0.75rem;">
                    <button type="button" onclick="loadNextEndlessQuestion()" class="primary-action-btn" style="flex: 1; padding: 0.75rem;">
                        次の問題へ <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <button type="button" onclick="changeScreen('top-screen')" style="cursor: pointer; padding: 0.75rem 1.25rem; background-color: #334155; color: #ffffff; font-weight: bold; border-radius: 1.0rem; border: 1px solid #64748b;">
                        Topに戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. テストモードプレイ画面 -->
        <div id="test-play-screen" style="display: none;">
            <div class="status-box">
                <span style="color: #fde047;"><i class="fa-solid fa-award"></i> 10問テスト</span>
                <span style="color: #cbd5e1;">問題 <span id="test-q-num">1</span>/10</span>
            </div>

            <div style="background-color: #0f172a; padding: 1.5rem; border-radius: 1rem; border: 1px solid #475569; margin-bottom: 1.5rem;">
                <p id="test-question-text" style="font-size: 1.1rem; font-weight: bold; margin: 0; line-height: 1.6;"></p>
            </div>

            <div id="test-options-container"></div>
        </div>

        <!-- 3. テスト結果画面 -->
        <div id="result-screen" style="display: none; text-align: center;">
            <h2 style="font-size: 1.5rem; color: #fde047; margin-bottom: 1.5rem;">🎉 テスト終了！ 🎉</h2>
            <div style="background-color: #0f172a; padding: 1.5rem; border-radius: 1rem; border: 1px solid #475569; margin-bottom: 1.5rem;">
                <p style="color: #94a3b8; font-weight: bold; margin: 0 0 0.5rem 0;">あなたのスコア</p>
                <p id="final-score" style="font-size: 3rem; font-weight: 900; color: #4ade80; margin: 0 0 0.5rem 0;">0 点</p>
                <p id="final-comment" style="font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin: 0;"></p>
            </div>

            <div style="text-align: left; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1rem; font-weight: 900; color: #ffffff; border-bottom: 1px solid #475569; padding-bottom: 0.5rem; margin-bottom: 1rem;">
                    <i class="fa-solid fa-clipboard-list" style="color: #fde047; margin-right: 0.5rem;"></i>こたえあわせ
                </h3>
                <div id="test-review-list" style="max-height: 20rem; overflow-y: auto; padding-right: 0.5rem; display: flex; flex-direction: column; gap: 0.75rem;"></div>
            </div>

            <button type="button" onclick="changeScreen('top-screen')" class="primary-action-btn">
                <i class="fa-solid fa-house" style="margin-right: 0.5rem;"></i>トップに戻る
            </button>
        </div>

    </main>

    <footer>
        kmj
    </footer>

    <script>
        // 選択肢の文字数・ボリューム感をすべて均等に揃えた118元素のデータ
        const elementQuestions = [
            { q: "水素(H)の性質・特性として正しいものはどれ？", correct: "火をつけると激しく燃えて水素爆発を起こす", dummies: ["常温で安定した液体として存在する非金属", "磁石に強く引きつけられる性質を持つ重金属"], explanation: "水素は火をつけると激しく燃え、『水素爆発』を起こすことも。宇宙で最も多く存在する最も軽い元素です。" },
            { q: "ヘリウム(He)の性質・特性として正しいものはどれ？", correct: "吸い込むと声が高くなる不燃性の気体である", dummies: ["強い毒性を持つ緑色の猛毒気体である", "常温で金属光沢を放つ重い固体である"], explanation: "ヘリウムは非常に軽く不燃性の気体で、吸い込むと声が高くなります。宇宙では水素の次に多い元素です。" },
            { q: "リチウム(Li)の性質・特性として正しいものはどれ？", correct: "実用金属の中で最も軽くバッテリーに使われる", dummies: ["ダイヤモンドより硬い無機の鉱物である", "常温・常圧で気体として存在する非金属"], explanation: "リチウムはすべての金属の中で最も密度が小さく非常に軽いため、スマホなどのリチウムイオン電池に欠かせません。" },
            { q: "ベリリウム(Be)の性質・特性として正しいものはどれ？", correct: "X線をよく通す性質があり窓材に使われる", dummies: ["水と激しく反応して大爆発を起こす物質", "常温で美しい青色の液体として存在する"], explanation: "ベリリウムはX線を透過しやすい特性があり、医療用や工業用のX線装置の窓材などに利用されます。" },
            { q: "ホウ素(B)の性質・特性として正しいものはどれ？", correct: "ガラスの原料や中性子を吸収する性質がある", dummies: ["電気をピカピカよく通す純粋な金属である", "水よりもはるかに軽い気体の非金属"], explanation: "ホウ素は半導体のドープ剤や耐熱ガラス（ホウケイ酸ガラス）、原子炉の制御棒などに使われます。" },
            { q: "炭素(C)の性質・特性として正しいものはどれ？", correct: "ダイヤモンドや黒鉛と同じ元素である", dummies: ["強い放射線を放つ危険な人工の重金属", "常温で液体として存在するハロゲン元素"], explanation: "炭素は全く見た目が異なるダイヤモンドや黒鉛などの多様な姿（同素体）をとることで知られています。" },
            { q: "窒素(N)の性質・特性として正しいものはどれ？", correct: "空気の約78%を占め反応性に乏しい", dummies: ["火をつけると激しく燃え上がる気体", "水に溶けると美しい緑色に変化する"], explanation: "窒素は地球の大気の大部分を占め、化学的におとなしく他の物質と反応しにくい不活性な気体です。" },
            { q: "酸素(O)の性質・特性として正しいものはどれ？", correct: "ものが燃えるのを助ける働きがある", dummies: ["水よりもはるかに重い金属の固体である", "磁石に強く引きつけられる性質を持つ"], explanation: "酸素は他の物質が燃えるのを助ける助燃性を持ち、生物の呼吸にも不可欠な重要な元素です。" },
            { q: "フッ素(F)の性質・特性として正しいものはどれ？", correct: "非常に反応性が高くあらゆる物質を侵す", dummies: ["金よりも輝く美しい装飾用の貴金属", "水に溶けると甘い味がする安全な気体"], explanation: "フッ素は全元素の中でトップクラスに強い酸化力と反応性を持ち、フッ素樹脂などに利用されます。" },
            { q: "ネオン(Ne)の性質・特性として正しいものはどれ？", correct: "放電すると赤橙色に光りネオンサインに使われる", dummies: ["常温で固体のまま存在する重い金属", "特有の甘いにおいを持つ危険な液体"], explanation: "ネオンは希ガスのひとつで、ガラス管に入れて電気を通すと鮮やかな赤橙色（ネオン管）に光ります。" },
            { q: "ナトリウム(Na)の性質・特性として正しいものはどれ？", correct: "水と激しく反応するため石油中で保存される", dummies: ["ダイヤモンドより硬い最強の鉱物である", "空気中では絶対に化学反応しない物質"], explanation: "ナトリウムは非常に柔らかい金属で、水と触れると激しく発熱・反応するため灯油などの中で保存されます。" },
            { q: "マグネシウム(Mg)の性質・特性として正しいものはどれ？", correct: "燃やすと強い白色光を放つ特徴がある", dummies: ["常温で唯一液体の状態を保つ金属", "磁石に強く引きつけられる重い鉱物"], explanation: "マグネシウムは軽量で実用性が高く、燃焼させるとまばゆい強い白色光を放つため花火や照明弾に使われます。" },
            { q: "アルミニウム(Al)の性質・特性として正しいものはどれ？", correct: "軽くて加工しやすく一円玉や缶に使われる", dummies: ["金よりもはるかに重い高価な貴金属", "水に溶かすと強い酸性を示す液体"], explanation: "アルミニウムは軽くて錆びにくく加工が簡単なため、アルミ缶や一円硬貨、航空機材などに広く使われています。" },
            { q: "ケイ素(Si)の性質・特性として正しいものはどれ？", correct: "半導体の材料としてコンピュータ等に不可欠である", dummies: ["常温で安定した液体として存在する金属", "空気中で自然発火する非常に危険な粉末"], explanation: "ケイ素は代表的な半導体元素であり、ICチップや太陽光パネルなど現代のIT社会を支える根幹です。" },
            { q: "リン(P)の性質・特性として正しいものはどれ？", correct: "黄リンは空気中で自然発火するほど反応性が高い", dummies: ["磁石に強く引きつけられる金属元素である", "地球上で最も重い安定した貴金属"], explanation: "リンにはいくつかの同素体があり、黄リンは空気中で自然発火するため水中保存され、赤リンはマッチ箱の側面等に使われます。" },
            { q: "硫黄(S)の性質・特性として正しいものはどれ？", correct: "黄色い粉末で温泉のにおいの元になる", dummies: ["常温で透明な液体として存在する金属", "電気を非常によく通す導電性の高い物質"], explanation: "硫黄は特徴的な黄色い固体で、火薬やゴムの加硫、温泉成分としてもおなじみの元素です。" },
            { q: "塩素(Cl)の性質・特性として正しいものはどれ？", correct: "黄緑色の有毒な気体でプールの消毒に使われる", dummies: ["甘い香りがする無色の安全な液体である", "常温でピカピカ光る高価な貴金属"], explanation: "塩素は刺激臭と強い殺菌力を持つ黄緑色の気体で、水道水の浄化やプールの消毒、塩の成分としても重要です。" },
            { q: "アルゴン(Ar)の性質・特性として正しいものはどれ？", correct: "空気中に約1%含まれる不活性な気体", dummies: ["火をつけると激しく燃える危険な気体", "常温で青色の美しい液体として存在"], explanation: "アルゴンは地球の空気に約0.93%含まれる希ガスで、溶接時のシールドガスなどに広く使われています。" },
            { q: "カリウム(K)の性質・特性として正しいものはどれ？", correct: "水と激しく反応し炎色反応で紫色を示す", dummies: ["ダイヤモンドよりも硬い無機の鉱物", "磁石に強く引きつけられる磁性金属"], explanation: "カリウムはアルカリ金属で水と激しく反応し、炎色反応では美しい紫色を呈します。肥料の三要素の一つです。" },
            { q: "カルシウム(Ca)の性質・特性として正しいものはどれ？", correct: "骨や歯の成分であり水と反応して水素を出す", dummies: ["常温で完全に液体の状態である金属", "金よりもはるかに高価な貴金属"], explanation: "カルシウムは生体の骨格を形作る重要な金属元素であり、水と緩やかに反応して水素ガスを発生させます。" },
            { q: "スカンジウム(Sc)の性質・特性として正しいものはどれ？", correct: "アルミニウムと合金にして軽量高強度にする", dummies: ["放射線を出すだけの極めて危険な物質", "水に溶かすと鮮やかな緑色になる"], explanation: "スカンジウムはアルミニウムに添加することで、航空宇宙用などの軽量で頑丈な特殊合金を作ることができます。" },
            { q: "チタン(Ti)の性質・特性として正しいものはどれ？", correct: "軽くて強く錆びにくいので医療や航空機に使われる", dummies: ["非常に柔らかく爪で傷がつく金属", "水に触れるとすぐに溶けて消える"], explanation: "チタンは比強度が高く（軽くて頑丈）、耐食性に優れているため、人工関節や航空機、スポーツ用品に重宝されます。" },
            { q: "バナジウム(V)の性質・特性として正しいものはどれ？", correct: "鋼に混ぜて強靭な合金を作る", dummies: ["常温で液体として存在する非金属", "空気に触れると大爆発を起こす物質"], explanation: "バナジウムは鋼に添加することで、耐摩耗性や強度が飛躍的に高まるため工具やエンジン部品に使われます。" },
            { q: "クロム(Cr)の性質・特性として正しいものはどれ？", correct: "ピカピカ光るメッキに使われ錆びを防ぐ", dummies: ["水に溶けると真っ赤に変化する液体", "非常に柔らかい粘土のような金属"], explanation: "クロムは耐食性が高く美しい金属光沢を持つため、自動車部品などのクロムメッキやステンレス鋼の原料になります。" },
            { q: "マンガン(Mn)の性質・特性として正しいものはどれ？", correct: "乾電池の原料や鉄の強度を高めるために使われる", dummies: ["常温で気体として存在する非金属", "金色の美しい輝きを持つ高価な貴金属"], explanation: "マンガンは乾電池（マンガン乾電池）の二酸化マンガンや、製鉄時の脱酸・強度向上用合金として重要です。" },
            { q: "鉄(Fe)の性質・特性として正しいものはどれ？", correct: "磁石に引きつけられ建造物や機械に欠かせない", dummies: ["水に浮くほど軽くて柔らかい金属", "常温で安定した液体である元素"], explanation: "鉄はもっとも広く使われる実用金属で、磁性があり加工しやすく、現代文明を支える基盤となっています。" },

        function changeScreen(screenId) {
            const screens = ['top-screen', 'endless-screen', 'test-play-screen', 'result-screen'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
            const target = document.getElementById(screenId);
            if (target) target.style.display = 'block';

            const homeBtn = document.getElementById('home-btn');
            if (screenId === 'top-screen') {
                homeBtn.style.display = 'none';
            } else {
                homeBtn.style.display = 'block';
            }
        }

        function generateRandom3Choices(qItem) {
            let shuffledDummies = [...qItem.dummies].sort(() => 0.5 - Math.random());
            let selectedDummies = shuffledDummies.slice(0, 2);

            let choices = [
                { text: qItem.correct, isCorrect: true },
                { text: selectedDummies[0], isCorrect: false },
                { text: selectedDummies[1], isCorrect: false }
            ];

            choices.sort(() => 0.5 - Math.random());
            let correctIndex = choices.findIndex(c => c.isCorrect);

            return {
                options: choices.map(c => c.text),
                answer: correctIndex
            };
        }

        let endlessScore = 0;
        let currentEndlessQ = {};

        function startEndless() {
            endlessScore = 0;
            document.getElementById('endless-score').innerText = endlessScore;
            changeScreen('endless-screen');
            loadNextEndlessQuestion();
        }

        function loadNextEndlessQuestion() {
            document.getElementById('endless-explanation-box').style.display = 'none';
            
            let rawQ = elementQuestions[Math.floor(Math.random() * elementQuestions.length)];
            let generated = generateRandom3Choices(rawQ);

            currentEndlessQ = {
                q: rawQ.q,
                options: generated.options,
                answer: generated.answer,
                explanation: rawQ.explanation
            };

            document.getElementById('endless-q-text').innerText = currentEndlessQ.q;

            let html = '';
            currentEndlessQ.options.forEach((opt, i) => {
                html += `<button type="button" onclick="checkEndlessAnswer(${i}, ${currentEndlessQ.answer})" class="option-btn">
                    <span class="opt-badge">${i + 1}</span> 
                    <span>${opt}</span>
                </button>`;
            });
            document.getElementById('endless-options').innerHTML = html;
        }

        function checkEndlessAnswer(selectedIndex, correctIndex) {
            const isCorrect = (selectedIndex === correctIndex);
            if (isCorrect) {
                endlessScore++;
                document.getElementById('endless-score').innerText = endlessScore;
            }

            const buttons = document.querySelectorAll('#endless-options button');
            buttons.forEach(btn => btn.disabled = true);

            const badge = document.getElementById('endless-result-badge');
            if (isCorrect) {
                badge.innerHTML = '<span style="color: #4ade80;">⭕ せいかい！</span>';
            } else {
                badge.innerHTML = '<span style="color: #f43f5e;">❌ ざんねん！不正解</span>';
            }
            document.getElementById('endless-exp-text').innerText = currentEndlessQ.explanation;
            document.getElementById('endless-explanation-box').style.display = 'block';
        }

        let testQuestions = [];
        let testIndex = 0;
        let testScore = 0;
        let userTestAnswers = [];

        function startTest() {
            let rawSelected = [...elementQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
            testQuestions = rawSelected.map(rawQ => {
                let generated = generateRandom3Choices(rawQ);
                return {
                    q: rawQ.q,
                    options: generated.options,
                    answer: generated.answer,
                    explanation: rawQ.explanation
                };
            });

            testIndex = 0;
            testScore = 0;
            userTestAnswers = [];

            changeScreen('test-play-screen');
            showTestQuestion();
        }

        function showTestQuestion() {
            if (testIndex >= testQuestions.length) {
                showTestResult();
                return;
            }

            document.getElementById('test-q-num').innerText = testIndex + 1;
            let qData = testQuestions[testIndex];
            document.getElementById('test-question-text').innerText = qData.q;

            let container = document.getElementById('test-options-container');
            container.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-badge">${idx + 1}</span> <span>${opt}</span>`;
                btn.onclick = () => checkTestAnswer(idx);
                container.appendChild(btn);
            });
        }

        function checkTestAnswer(selectedIdx) {
            let qData = testQuestions[testIndex];
            let isCorrect = (selectedIdx === qData.answer);
            if (isCorrect) {
                testScore += 10;
            }

            userTestAnswers.push({
                question: qData.q,
                options: qData.options,
                userAnswerIdx: selectedIdx,
                correctIdx: qData.answer,
                isCorrect: isCorrect,
                explanation: qData.explanation
            });

            testIndex++;
            showTestQuestion();
        }

        function showTestResult() {
            changeScreen('result-screen');
            document.getElementById('final-score').innerText = `${testScore} 点`;

            let comment = "";
            if (testScore === 100) comment = "👑 完璧です！元素博士の称号を授与します！";
            else if (testScore >= 70) comment = "👏 すごい！元素の性質をよく理解しています！";
            else if (testScore >= 40) comment = "👍 まずまずの成績！解説を読んで苦手を克服しよう！";
            else comment = "💪 もう一度挑戦して満点を目指そう！";
            document.getElementById('final-comment').innerText = comment;

            const container = document.getElementById('test-review-list');
            let html = '';
            userTestAnswers.forEach((item, idx) => {
                let statusBadge = item.isCorrect 
                    ? '<span style="padding: 0.25rem 0.5rem; background-color: rgba(74,222,128,0.2); color: #4ade80; border: 1px solid #4ade80; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold;">⭕ 正解</span>' 
                    : '<span style="padding: 0.25rem 0.5rem; background-color: rgba(244,63,94,0.2); color: #f43f5e; border: 1px solid #f43f5e; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold;">❌ ざんねん</span>';
                
                let userAnsText = item.options[item.userAnswerIdx];
                let correctAnsText = item.options[item.correctIdx];

                html += `
                    <div style="background-color: #020617; padding: 1rem; border-radius: 0.75rem; border: 1px solid #334155; text-align: left;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <span style="font-size: 0.75rem; font-weight: bold; color: #94a3b8;">第 ${idx + 1} 問 (+10点)</span>
                            ${statusBadge}
                        </div>
                        <p style="font-size: 0.85rem; font-weight: bold; color: #ffffff; margin: 0 0 0.5rem 0;">${item.question}</p>
                        <div style="font-size: 0.75rem; border-top: 1px solid #1e293b; padding-top: 0.5rem;">
                            <div style="color: #cbd5e1; margin-bottom: 0.25rem;">あなたの答え：<span style="color: ${item.isCorrect ? '#4ade80' : '#f43f5e'}; font-weight: bold;">${userAnsText}</span></div>
                            ${!item.isCorrect ? `<div style="color: #4ade80; font-weight: bold; margin-bottom: 0.25rem;">正しい答え：<span>${correctAnsText}</span></div>` : ''}
                            <div style="color: #94a3b8; font-weight: bold; margin-top: 0.25rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.25rem; line-height: 1.4;">💡 解説：${item.explanation}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
