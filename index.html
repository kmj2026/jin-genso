<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素の性質・特性クイズ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#facc15', // Neon Yellow
                            blue: '#38bdf8',   // Neon Blue
                            pink: '#f43f5e',   // Neon Pink
                            green: '#4ade80'   // Neon Green
                        }
                    },
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
                        teko: ['Teko', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }
        .pop-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 3px solid #38bdf8;
        }
        .pop-button {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #0284c7;
        }
        .pop-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0284c7;
        }
        @keyframes pulse-pop {
            0% { transform: scale(0.7); opacity: 0; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-countdown {
            animation: pulse-pop 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <!-- 共通カウントダウンオーバーレイ -->
    <div id="countdown-overlay" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center">
        <div id="countdown-text" class="text-7xl md:text-9xl font-black text-cyber-accent tracking-wider drop-shadow-[0_0_25px_rgba(250,204,21,0.8)] animate-countdown">
            3
        </div>
        <p class="text-slate-300 font-bold text-lg mt-4">じゅんびしてね！</p>
    </div>

    <!-- 共通ヘッダー -->
    <header class="w-full max-w-2xl flex items-center justify-between py-4">
        <button onclick="showScreen('top-screen')" id="home-btn" class="hidden px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyber-accent rounded-xl border border-cyber-accent font-bold text-sm transition">
            <i class="fa-solid fa-house mr-1"></i>トップに戻る
        </button>
        <div class="text-center flex-1">
            <h1 class="text-2xl md:text-3xl font-black text-cyber-accent tracking-wider drop-shadow">
                🧪 元素の性質・特性クイズ 🧪
            </h1>
        </div>
        <div class="w-20"></div>
    </header>

    <!-- メインエリア -->
    <main class="w-full max-w-2xl bg-cyber-card rounded-3xl p-6 md:p-8 pop-card mb-6 space-y-6">

        <!-- 0. トップメニュー画面 -->
        <div id="top-screen" class="space-y-6 text-center">
            <h2 class="text-2xl font-black text-white mb-2">
                <i class="fa-solid fa-flask text-cyber-accent mr-2"></i>モードを選んでね！（全118元素対応）
            </h2>
            
            <div class="space-y-2 text-left pb-2">
                <label class="text-sm font-bold text-cyber-blue"><i class="fa-solid fa-user mr-2"></i>プレイヤーのなまえ：</label>
                <input type="text" id="player-name" placeholder="なまえを入力（例: じん）" 
                    class="w-full p-4 rounded-2xl bg-slate-900 border-2 border-cyber-blue text-white font-bold text-xl text-center focus:outline-none focus:border-cyber-accent">
            </div>

            <div class="grid grid-cols-1 gap-4">
                <button onclick="startEndlessMode()" class="pop-button flex items-center justify-between p-5 bg-sky-500 hover:bg-sky-400 text-slate-900 font-black text-xl rounded-2xl border-2 border-white text-left">
                    <div class="flex items-center space-x-4">
                        <i class="fa-solid fa-infinity text-3xl"></i>
                        <div>
                            <div>エンドレスモード</div>
                            <div class="text-xs text-slate-800 font-bold mt-0.5">118元素からランダム！3択（正解＋ランダムダミー2つ）</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <button onclick="startTestMode()" class="pop-button flex items-center justify-between p-5 bg-purple-500 hover:bg-purple-400 text-slate-900 font-black text-xl rounded-2xl border-2 border-white text-left">
                    <div class="flex items-center space-x-4">
                        <i class="fa-solid fa-award text-3xl"></i>
                        <div>
                            <div>10問テストモード</div>
                            <div class="text-xs text-slate-800 font-bold mt-0.5">重複なしで10問出題！最後にまとめて解説レポート</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- 1. エンドレスモードプレイ画面 -->
        <div id="endless-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-700">
                <span class="text-lg font-black text-cyber-accent"><i class="fa-solid fa-infinity mr-1"></i>エンドレスモード</span>
                <span class="text-sm font-bold text-cyber-green">せいかい数: <span id="endless-score" class="text-xl font-black">0</span>問</span>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 min-h-[100px] flex items-center">
                <p id="endless-q-text" class="text-lg md:text-xl font-bold text-white leading-relaxed">ここに問題文が入ります。</p>
            </div>

            <div id="endless-options" class="grid grid-cols-1 gap-3"></div>

            <!-- 解説エリア（回答後に表示） -->
            <div id="endless-explanation-box" class="hidden bg-slate-950 p-5 rounded-2xl border-2 border-cyber-accent space-y-4">
                <div id="endless-result-badge" class="text-xl font-black"></div>
                <p id="endless-exp-text" class="text-sm md:text-base text-slate-200 leading-relaxed font-bold"></p>
                <div class="flex gap-3 pt-2">
                    <button onclick="nextEndlessQuestion()" class="pop-button flex-1 py-3 bg-cyber-accent text-slate-900 font-black text-base rounded-xl border border-white">
                        次の問題へ <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                    <button onclick="showScreen('top-screen')" class="pop-button px-5 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-base rounded-xl border border-slate-600">
                        Topに戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. テストモードプレイ画面 -->
        <div id="test-play-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-700">
                <span class="text-lg font-black text-cyber-accent"><i class="fa-solid fa-award mr-1"></i>10問テストモード</span>
                <span class="text-sm font-bold text-slate-300">問題 <span id="test-q-num">1</span>/10</span>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 min-h-[100px] flex items-center">
                <p id="test-question-text" class="text-lg md:text-xl font-bold text-white leading-relaxed">ここに問題文が入ります。</p>
            </div>

            <div id="test-options-container" class="grid grid-cols-1 gap-3"></div>
        </div>

        <!-- 3. テスト結果＆こたえあわせ画面 -->
        <div id="result-screen" class="hidden space-y-6 text-center">
            <h2 class="text-3xl font-black text-cyber-accent">🎉 テスト終了！ 🎉</h2>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 space-y-2">
                <p class="text-slate-400 font-bold">あなたのスコア</p>
                <p id="final-score" class="text-6xl font-black text-cyber-green">0 点</p>
                <p id="final-comment" class="text-sm text-cyber-blue font-bold pt-1"></p>
            </div>

            <!-- こたえあわせ（正誤一覧＆解説） -->
            <div class="space-y-4 text-left">
                <h3 class="text-xl font-black text-white border-b border-slate-700 pb-2">
                    <i class="fa-solid fa-clipboard-list text-cyber-accent mr-2"></i>こたえあわせ（解説レポート）
                </h3>
                <div id="test-review-list" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
            </div>

            <div class="pt-2">
                <button onclick="showScreen('top-screen')" class="pop-button w-full py-4 bg-cyber-accent text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                    <i class="fa-solid fa-house mr-2"></i>トップメニューに戻る
                </button>
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center text-xs text-slate-500 font-bold pb-2">
        kmj
    </footer>

    <script>
        // 1〜118元素すべての性質・特性データベース ＆ 各元素ごとのダミー選択肢（5つ以上用意）
        const elementQuestions = [
            { q: "水素(H)の性質・特性として正しいものはどれ？", correct: "火をつけると激しく燃える", dummies: ["常温で液体である", "磁石に強く引きつけられる", "水よりも重い固体である", "電気をピカピカよく通す金属である", "強い放射線を出す"], explanation: "水素は火をつけると激しく燃え、『水素爆発』を起こすことも。宇宙で最も多く存在する最も軽い元素です。" },
            { q: "ヘリウム(He)の性質・特性として正しいものはどれ？", correct: "吸い込むと声が高くなる", dummies: ["強い毒性がある", "水に溶かすと強い酸性になる", "常温で気体の金属である", "空気に触れると爆発する", "磁石にくっつく"], explanation: "ヘリウムは非常に軽く不燃性の気体で、吸い込むと声が高くなります。宇宙では水素の次に多い元素です。" },
            { q: "リチウム(Li)の性質・特性として正しいものはどれ？", correct: "実用金属の中で最も軽く、バッテリーに使われる", "ダイヤモンドより硬い", "常温で気体である", "水よりも重い", "特有の甘いにおいを持つ"], explanation: "リチウムはすべての金属の中で最も密度が小さく非常に軽いため、スマホなどのリチウムイオン電池に欠かせません。" },
            { q: "ベリリウム(Be)の性質・特性として正しいものはどれ？", correct: "X線をよく通す性質があり、窓材に使われる", "水に触れると爆発する", "磁石にくっつく", "常温で液体である", "甘い香りがする液体"], explanation: "ベリリウムはX線を透過しやすい特性があり、医療用や工業用のX線装置の窓材などに利用されます。" },
            { q: "ホウ素(B)の性質・特性として正しいものはどれ？", correct: "ガラスの原料や、中性子を吸収する性質がある", "電気をピカピカよく通す金属である", "常温で液体である", "空気中で自然発火する", "水に浮くほど軽い"], explanation: "ホウ素は半導体のドープ剤や耐熱ガラス（ホウケイ酸ガラス）、原子炉の制御棒などに使われます。" },
            { q: "炭素(C)の性質・特性として正しいものはどれ？", correct: "ダイヤモンドや黒鉛（鉛筆の芯）と同じ元素である", "金属の一種である", "常温で気体である", "水と激しく反応する", "強い放射性を持つ"], explanation: "炭素は全く見た目が異なるダイヤモンドや黒鉛などの多様な姿（同素体）をとることで知られています。" },
            { q: "窒素(N)の性質・特性として正しいものはどれ？", correct: "空気の約78%を占め、反応性に乏しい", "火をつけると激しく燃える", "強い毒性を持つ", "常温で固体の金属である", "水に溶けて緑色になる"], explanation: "窒素は地球の大蔵の大部分を占め、化学的におとなしく他の物質と反応しにくい不活性な気体です。" },
            { q: "酸素(O)の性質・特性として正しいものはどれ？", correct: "ものが燃えるのを助ける働きがある", "無色ではなく緑色の気体である", "水よりも重い固体である", "磁石に引きつけられる", "常温で液体である"], explanation: "酸素は他の物質が燃えるのを助ける助燃性を持ち、生物の呼吸にも不可欠な重要な元素です。" },
            { q: "フッ素(F)の性質・特性として正しいものはどれ？", correct: "非常に反応性が高く、あらゆる物質を侵す", "金よりも輝く美しい金属である", "水に溶けると甘い味がする", "常温で安定な気体である", "電気を通さない"], explanation: "フッ素は全元素の中でトップクラスに強い酸化力と反応性を持ち、フッ素樹脂などに利用されます。" },
            { q: "ネオン(Ne)の性質・特性として正しいものはどれ？", correct: "放電すると赤橙色に光り、ネオンサインに使われる", "常温で固体の金属である", "特有の甘いにおいを持つ", "水に溶けると強酸になる", "非常に軽い気体の金属"], explanation: "ネオンは希ガスのひとつで、ガラス管に入れて電気を通すと鮮やかな赤橙色（ネオン管）に光ります。" },
            { q: "ナトリウム(Na)の性質・特性として正しいものはどれ？", correct: "水と激しく反応するため石油中で保存される", "ダイヤモンドより硬い鉱物である", "空気中では全く反応しない", "常温で気体である", "磁石にくっつく"], explanation: "ナトリウムは非常に柔らかい金属で、水と触れると激しく発熱・反応するため灯油などの中で保存されます。" },
            { q: "マグネシウム(Mg)の性質・特性として正しいものはどれ？", correct: "燃やすと強い白色光を放つ", "常温で液体である", "磁石に強く引きつけられる", "水に溶けると酸性になる", "空中で自然発火しない"], explanation: "マグネシウムは軽量で実用性が高く、燃焼させるとまばゆい強い白色光を放つため花火や照明弾に使われます。" },
            { q: "アルミニウム(Al)の性質・特性として正しいものはどれ？", correct: "軽くて加工しやすく、一円玉や缶に使われる", "金よりも重い貴金属である", "水に溶かすと強い酸性になる", "常温で気体である", "磁石に強く引きつけられる"], explanation: "アルミニウムは軽くて錆びにくく加工が簡単なため、アルミ缶や一円硬貨、航空機材などに広く使われています。" },
            { q: "ケイ素(Si)の性質・特性として正しいものはどれ？", correct: "半導体の材料としてコンピュータ等に不可欠である", "常温で液体である", "空気中で自然発火する", "水に浮く軽い金属", "強い放射線を出す"], explanation: "ケイ素は代表的な半導体元素であり、ICチップや太陽光パネルなど現代のIT社会を支える根幹です。" },
            { q: "リン(P)の性質・特性として正しいものはどれ？", correct: "黄リンは空気中で自然発火するほど反応性が高い", "磁石に強く引きつけられる金属である", "地球上で最も重い元素である", "常温で気体である", "水に溶けると甘い"], explanation: "リンにはいくつかの同素体があり、黄リンは空気中で自然発火するため水中保存され、赤リンはマッチ箱の側面等に使われます。" },
            { q: "硫黄(S)の性質・特性として正しいものはどれ？", correct: "黄色い粉末で、温泉のにおい（硫化水素など）の元になる", "常温で液体である", "電気を非常によく通す金属である", "水に浮くほど軽い", "強い放射性を持つ"], explanation: "硫黄は特徴的な黄色い固体で、火薬やゴムの加硫、温泉成分としてもおなじみの元素です。" },
            { q: "塩素(Cl)の性質・特性として正しいものはどれ？", correct: "黄緑色の有毒な気体で、プールの消毒に使われる", "甘い香りがする無色の液体である", "常温でピカピカ光る金属である", "水より軽い気体", "磁石にくっつく"], explanation: "塩素は刺激臭と強い殺菌力を持つ黄緑色の気体で、水道水の浄化やプールの消毒、塩の成分としても重要です。" },
            { q: "アルゴン(Ar)の性質・特性として正しいものはどれ？", correct: "空気中に約1%含まれる不活性な気体", "燃えやすい危険な気体", "常温で青色の液体", "水に溶けると強酸になる", "非常に重い金属"], explanation: "アルゴンは地球の空気に約0.93%含まれる希ガスで、溶接時のシールドガスなどに広く使われています。" },
            { q: "カリウム(K)の性質・特性として正しいものはどれ？", correct: "水と激しく反応し、炎色反応で紫色を示す", "ダイヤモンドより硬い", "磁石にくっつく", "常温で気体である", "水に溶けない石"], explanation: "カリウムはアルカリ金属で水と激しく反応し、炎色反応では美しい紫色を呈します。肥料の三要素の一つです。" },
            { q: "カルシウム(Ca)の性質・特性として正しいものはどれ？", correct: "骨や歯の成分であり、水と反応して水素を出す", "常温で液体である", "金よりも高価な貴金属である", "気体の非金属", "磁石に強く引きつけられる"], explanation: "カルシウムは生体の骨格を形作る重要な金属元素であり、水と緩やかに反応して水素ガスを発生させます。" },
            { q: "スカンジウム(Sc)の性質・特性として正しいものはどれ？", correct: "アルミニウムと合金にして軽量高強度な材料にする", "放射線を出すだけの危険な物質", "水に溶けて緑色になる", "常温で気体である", "非常に柔らかい金属"], explanation: "スカンジウムはアルミニウムに添加することで、航空宇宙用などの軽量で頑丈な特殊合金を作ることができます。" },
            { q: "チタン(Ti)の性質・特性として正しいものはどれ？", correct: "軽くて強く錆びにくいので医療や航空機に使われる", "非常に柔らかい金属", "水に溶けやすい", "常温で気体である", "磁石にくっつく"], explanation: "チタンは比強度が高く（軽くて頑丈）、耐食性に優れているため、人工関節や航空機、スポーツ用品に重宝されます。" },
            { q: "バナジウム(V)の性質・特性として正しいものはどれ？", correct: "鋼に混ぜて強靭な合金（バナジウム鋼）を作る", "常温で液体である", "空気に触れると爆発する", "水に浮く", "非常に柔らかい"], explanation: "バナジウムは鋼に添加することで、耐摩耗性や強度が飛躍的に高まるため工具やエンジン部品に使われます。" },
            { q: "クロム(Cr)の性質・特性として正しいものはどれ？", correct: "ピカピカ光るメッキに使われ、錆びを防ぐ", "水に溶けると赤くなる", "非常に柔らかい金属", "常温で気体である", "水よりも軽い"], explanation: "クロムは耐食性が高く美しい金属光沢を持つため、自動車部品などのクロムメッキやステンレス鋼の原料になります。" },
            { q: "マンガン(Mn)の性質・特性として正しいものはどれ？", correct: "乾電池の原料や、鉄の強度を高めるために使われる", "常温で気体である", "金色の美しい金属", "水に溶けると爆発する", "非常に柔らかい"], explanation: "マンガンは乾電池（マンガン乾電池）の二酸化マンガンや、製鉄時の脱酸・強度向上用合金として重要です。" },
            { q: "鉄(Fe)の性質・特性として正しいものはどれ？", correct: "磁石に引きつけられ、建造物や機械に欠かせない", "水に浮くほど軽い", "常温で液体である", "空気中で自然発火する", "全く錆びない金属"], explanation: "鉄はもっとも広く使われる実用金属で、磁性があり加工しやすく、現代文明を支える基盤となっています。" },
            { q: "コバルト(Co)の性質・特性として正しいものはどれ？", correct: "強力な磁石の材料や青色の顔料（コバルトブルー）になる", "常温で気体である", "水と激しく爆発する", "水に浮く金属", "非常に柔らかい"], explanation: "コバルトは強力な永久磁石の原料や、陶磁器などを鮮やかな青色に染めるコバルトブルーの顔料に使われます。" },
            { q: "ニッケル(Ni)の性質・特性として正しいものはどれ？", correct: "錆びにくく、硬貨（五百円玉など）の材料に使われる", "常温で液体である", "水に溶けると緑色になる", "空気中で爆発する", "非常に柔らかい"], explanation: "ニッケルは耐食性に優れ、ステンレスや五百円硬貨などの白銅貨の材料、電池の電極などに使われます。" },
            { q: "銅(Cu)の性質・特性として正しいものはどれ？", correct: "赤褐色で、電気や熱を非常によく伝える", "銀白色で空気中で爆発する", "水に浮く", "常温で気体である", "磁石に強く引きつけられる"], explanation: "銅は美しい赤褐色で、電気伝導性が高いため電線や電子基板、10円硬貨などに広く利用されています。" },
            { q: "亜鉛(Zn)の性質・特性として正しいものはどれ？", correct: "鉄のトタン板の錆び止め（亜鉛めっき）に使われる", "常温で液体である", "金よりも高価である", "水と激しく反応して爆発する", "気体の非金属"], explanation: "亜鉛は鉄の腐食を防ぐための表面処理（亜鉛めっき、トタン）や乾電池の負極などに利用されます。" },
            { q: "ガリウム(Ga)の性質・特性として正しいものはどれ？", correct: "手のひらの体温（約30度）で溶けるほど融点低め", "常温で気体である", "激しく水と反応する", "磁石にくっつく金属", "非常に硬い鉱物"], explanation: "ガリウムは約29.8℃で液体になるため、手のひらに乗せると体温でスルスルと溶け出すユニークな金属です。" },
            { q: "ゲルマニウム(Ge)の性質・特性として正しいものはどれ？", correct: "初期の半導体としてトランジスタ等に利用された", "水銀の一種である", "常温で気体である", "水に溶かすと爆発する", "金ぴかの貴金属"], explanation: "ゲルマニウムは代表的な半導体材料で、トランジスタの歴史の扉を開いた重要な元素です。" },
            { q: "ヒ素(As)の性質・特性として正しいものはどれ？", correct: "有名な毒物として知られるが、半導体等にも使われる", "甘い香りのする安全な気体", "金ぴかに輝く貴金属", "常温で液体である", "水に浮く"], explanation: "ヒ素は古くから強力な毒物として有名ですが、ガリウムヒ素などの化合物半導体材料としても重要です。" },
            { q: "セレン(Se)の性質・特性として正しいものはどれ？", correct: "光を受けると電気の通りやすさが変わる（光導電性）", "常温で液体である", "強い放射線を出す", "水と激しく反応する", "気体の貴金属"], explanation: "セレンは光が当たると電気抵抗が変化する性質（光導電性）があり、コピー機や光センサーに使われます。" },
            { q: "臭素(Br)の性質・特性として正しいものはどれ？", correct: "常温で液体である数少ない非金属元素", "空気より軽い気体", "磁石にくっつく金属", "水と激しく反応する", "無色透明の固体"], explanation: "臭素は水銀と並び、常温・常圧で液体として存在する数少ない元素のひとつで、刺激臭のある赤褐色の液体です。" },
            { q: "クリプトン(Kr)の性質・特性として正しいものはどれ？", correct: "希ガスのひとつで、高輝度電球や断熱窓に封入される", "強い毒性を持つ緑色の気体", "水に溶けると強酸になる", "常温で固体の金属", "磁石にくっつく"], explanation: "クリプトンは不活性な希ガスで、写真のフラッシュランプや複層ガラスの断熱層などに使われます。" },
            { q: "ルビジウム(Rb)の性質・特性として正しいものはどれ？", correct: "アルカリ金属で、空気に触れると自然発火する", "ダイヤモンドより硬い", "常温で気体である", "水に溶けない石", "磁石にくっつく"], explanation: "ルビジウムは非常に反応性が高いアルカリ金属で、原子時計や特殊なガラスの製造などに用いられます。" },
            { q: "ストロンチウム(Sr)の性質・特性として正しいものはどれ？", correct: "花火の炎色反応で鮮やかな紅色を出す", "水に浮くほど軽い", "常温で液体である", "電気をよく通さない非金属", "強い毒性を持つ気体"], explanation: "ストロンチウムの塩類は、花火や発炎筒で鮮やかな赤色（紅色）を出すための主成分として利用されます。" },
            { q: "イットリウム(Y)の性質・特性として正しいものはどれ？", correct: "LEDやレーザー、超伝導材料などの先端技術に使われる", "猛毒の気体", "常温で液体", "水と激しく反応する", "磁石に全く反応しない"], explanation: "イットリウムは希土類（レアアース）の一つで、LEDの蛍光体や高温超伝導体の材料として重要です。" },
            { q: "ジルコニウム(Zr)の性質・特性として正しいものはどれ？", correct: "耐熱性・耐食性が非常に高く、原子炉やセラミックに", "水に溶けやすい柔らかい金属", "常温で気体", "金よりも高価な貴金属", "磁石にくっつく"], explanation: "ジルコニウムは中性子を吸収しにくく耐熱・耐食性に優れるため、原子力発電所の燃料被覆管などに使われます。" },
            { q: "ニオブ(Nb)の性質・特性として正しいものはどれ？", correct: "超伝導磁石や、特殊な耐熱合金（ジェットエンジン用）に", "猛毒の液体", "金色の貴金属", "常温で気体", "水に溶ける"], explanation: "ニオブは超伝導特性を持ち、リニアモーターカーなどの超伝導磁石や航空宇宙用の耐熱合金に添加されます。" },
            { q: "モリブデン(Mo)の性質・特性として正しいものはどれ？", correct: "高融点で、鋼の強度や耐熱性を高める合金に", "常温で気体", "水に溶けて爆発する", "非常に柔らかい金属", "水に浮く"], explanation: "モリブデンは融点が非常に高く、工具や装甲板、エンジン部品に使う高強度なモリブデン鋼の必須成分です。" },
            { q: "テクネチウム(Tc)の性質・特性として正しいものはどれ？", correct: "人工的に作られた放射性元素で、医療診断に使われる", "自然界に大量にある安定な金属", "常温で液体", "水に溶けない気体", "無害な栄養素"], explanation: "テクネチウムはすべての同位体が放射性を持つ人工元素の代表例で、医療用の放射性医薬品として利用されます。" },
            { q: "ルテニウム(Ru)の性質・特性として正しいものはどれ？", correct: "白金族の硬い金属で、電子部品の抵抗器等に", "水に溶ける金属", "常温で気体", "非常に柔らかい", "空気中で爆発する"], explanation: "ルテニウムは白金族の一つで、摩耗に強く安定しているため、チップ抵抗器などの電子部品に使われます。" },
            { q: "ロジウム(Rh)の性質・特性として正しいものはどれ？", correct: "非常に美しく輝き、装飾品のメッキ（ロジウムメッキ）に", "毒性の強い気体", "水に浮く金属", "常温で気体", "水と激しく反応する"], explanation: "ロジウムは白金族の貴金属で、光沢が美しく変色しないためシルバーアクセ等の高級メッキとして重宝されます。" },
            { q: "パラジウム(Pd)の性質・特性として正しいものはどれ？", correct: "水素を大量に吸収する性質があり、触媒等に使われる", "常温で液体", "非常に軽い気体", "水と激しく爆発する", "磁石にくっつく"], explanation: "パラジウムは水素を自身の体積の何百倍も吸収する特性があり、自動車の排ガス浄化触媒などに不可欠です。" },
            { q: "銀(Ag)の性質・特性として正しいものはどれ？", correct: "全金属の中で電気と熱の伝導性が最も高い", "常温で気体の金属", "水と激しく反応する", "空気中で自然発火する", "非常に重い気体"], explanation: "銀はすべての金属の中で最も電気抵抗が低く熱伝導率が高いため、電子回路や高級食器、銀貨に使われます。" },
            { q: "カドミウム(Cd)の性質・特性として正しいものはどれ？", correct: "充電式電池（ニカド電池）などに使われたが毒性がある", "ダイヤモンドより硬い", "常温で気体", "水に溶けて甘い", "安全な栄養素"], explanation: "カドミウムはかつてニッケル・カドミウム蓄電池などに広く使われましたが、公害病（イタイイタイ病）の原因となる有害金属です。" },
            { q: "インジウム(In)の性質・特性として正しいものはどれ？", correct: "透明導電膜（ITO）の材料としてスマホ画面等に必須", "非常に硬い鉱物", "常温で気体", "水と激しく爆発する", "強い放射性を持つ"], explanation: "インジウムは酸化物と合わせることで透明かつ電気を通す膜（ITO）になり、スマホやPCのタッチパネルに欠かせません。" },
            { q: "スズ(Sn)の性質・特性として正しいものはどれ？", correct: "錆びにくく、メッキ（ブリキ）やハンダの成分になる", "常温で気体", "強い放射線を出す", "水と激しく反応する", "ダイヤモンドより硬い"], explanation: "スズは加工しやすく毒性が低いため、鉄板の表面処理（ブリキ）や電子基板を接合するハンダの主成分として使われます。" },
            { q: "アンチモン(Sb)の性質・特性として正しいものはどれ？", correct: "半金属であり、合金の硬度を上げるために添加される", "常温で液体", "甘い香りの気体", "水に浮く", "金よりも高価"], explanation: "アンチモンは鉛などと混ぜて硬度を上げる合金（活字やバッテリー）や、難燃剤の材料として利用されます。" },
            { q: "テルル(Te)の性質・特性として正しいものはどれ？", correct: "半導体特性を持ち、DVD-RWなどの記録層に使われる", "常温で気体", "水に溶けると美しい青色になる", "磁石にくっつく", "非常に柔らかい"], explanation: "テルルはレアメタルの一種で、rewritable（書き換え可能）な光ディスク（DVD-RW等）の相変化記録材料に使われます。" },
            { q: "ヨウ素(I)の性質・特性として正しいものはどれ？", correct: "紫黒色の固体で、加熱すると美しい紫色の気体に", "常温で無色の液体", "磁石にくっつく金属", "水と激しく反応する", "非常に軽い気体"], explanation: "ヨウ素は昇華しやすい紫黒色の固体で、うがい薬や消毒液、海藻などに含まれる必須栄養素です。" },
            { q: "キセノン(Xe)の性質・特性として正しいものはどれ？", correct: "放電させると強い白色光を放ち、車のヘッドライト等に", "猛毒の液体", "水に溶けて強酸になる", "常温で固体の金属", "磁石にくっつく"], explanation: "キセノンは重い希ガスで、高輝度放電灯（HIDヘッドライト）やイオンエンジンの推進剤などに使われます。" },
            { q: "セシウム(Cs)の性質・特性として正しいものはどれ？", correct: "非常に反応性が高いアルカリ金属で、原子時計の基準に", "常温で硬いダイヤモンド状の固体", "気体の貴金属", "水に溶けない", "磁石にくっつく"], explanation: "セシウムは極めて反応しやすいアルカリ金属で、秒の定義（原子時計）の基準としても歴史的に重要な元素です。" },
            { q: "バリウム(Ba)の性質・特性として正しいものはどれ？", correct: "X線造影剤（バリウム検査）や、緑色の花火の炎色反応に", "水に浮く軽い金属", "常温で気体", "金よりも高価", "磁石にくっつく"], explanation: "硫酸バリウムは胃のX線検査（バリウム検査）の造影剤として飲まれ、化合物は花火の緑色の炎色反応にも使われます。" },
            { q: "ランタン(La)の性質・特性として正しいものはどれ？", correct: "カメラの高級レンズや水素貯蔵合金の材料に", "猛毒の気体", "水に溶けて爆発する", "常温で気体", "磁石にくっつく"], explanation: "ランタンは希土類元素の一つで、屈折率の高い光学ガラス（カメラレンズ）やニッケル水素電池の負極材に使われます。" },
            { q: "セリウム(Ce)の性質・特性として正しいものはどれ？", correct: "ライターの発火石（ミッシュメタル）やガラス研磨剤に", "常温で液体", "放射性物質のみ", "水に浮く", "気体の非金属"], explanation: "セリウムはレアアースの中で最も存在量が多く、ライターの火花を散らす発火石やガラスの研磨剤として活躍します。" },
            { q: "プラセオジム(Pr)の性質・特性として正しいものはどれ？", correct: "ガラスやセラミックスの黄色〜緑色の着色に使われる", "常温で気体", "非常に軽い金属", "水と激しく反応する", "磁石にくっつく"], explanation: "プラセオジムは希土類元素の一つで、溶接工用のゴーグル（有害光線カット）や陶磁器の着色料に利用されます。" },
            { q: "ネオジム(Nd)の性質・特性として正しいものはどれ？", correct: "最強の磁力を持つ「ネオジム磁石」の材料になる", "常温で液体", "水と激しく爆発する", "水に浮く", "気体の非金属"], explanation: "ネオジムは鉄やボロンと合わせた「ネオジム磁石」の主成分であり、現在世界で最も強力な永久磁石として知られます。" },
            { q: "プロメチウム(Pm)の性質・特性として正しいものはどれ？", correct: "すべての同位体が放射性を持つ人工的・レアな元素", "自然界に金と同じくらい豊富にある", "常温で液体金属", "安全な栄養素", "水と激しく反応する"], explanation: "プロメチウムは安定同位体が存在しない放射性元素で、夜光塗料や厚さ測定器などの微小線源として利用されます。" },
            { q: "サマリウム(Sm)の性質・特性として正しいものはどれ？", correct: "強力なサマリウム・コバルト磁石（耐熱磁石）の材料に", "常温で気体", "水に溶ける金属", "非常に軽い", "気体の貴金属"], explanation: "サマリウムはコバルトと合わせることで高温でも磁力が落ちにくい強力な耐熱磁石（サマコバ磁石）を作れます。" },
            { q: "ユウロピウム(Eu)の性質・特性として正しいものはどれ？", correct: "カラーテレビ等の赤色蛍光体の原料になる", "常温で液体", "猛毒の気体", "水と激しく反応する", "磁石にくっつく"], explanation: "ユウロピウムは発光特性に優れ、かつてのカラーブラウン管や現在の蛍光灯・LEDの赤色発光の要となる元素です。" },
            { q: "ガドリニウム(Gd)の性質・特性として正しいものはどれ？", correct: "MRI検査の造影剤や、強力な磁気冷凍の材料に", "水に浮く金属", "常温で気体", "水と激しく爆発する", "金色の貴金属"], explanation: "ガドリニウムは強い磁性を示し、医療用のMRI検査で体内を鮮明に映し出す造影剤などの医療分野で重宝されます。" },
            { q: "テルビウム(Tb)の性質・特性として正しいものはどれ？", correct: "緑色蛍光体や、磁歪材料（磁石で形が変わる）に使われる", "常温で液体", "無色の気体", "水に溶ける", "非常に軽い"], explanation: "テルビウムはカラーディスプレイの緑色発光や、磁力を当てると伸縮する特殊な合金（テルフェノールD）に使われます。" },
            { q: "ジスプロシウム(Dy)の性質・特性として正しいものはどれ？", correct: "ネオジム磁石の耐熱性を高めるために添加される", "水に溶けて爆発する", "常温で気体", "水に浮く金属", "安全な栄養素"], explanation: "ジスプロシウムはネオジム磁石に混ぜることで、高温になっても磁力が弱くならない優れた耐熱性能を付与します。" },
            { q: "ホルミウム(Ho)の性質・特性として正しいものはどれ？", correct: "全元素の中で最も高い磁気モーメント（磁力）を持つ", "常温で液体", "甘い香りの気体", "水と激しく反応する", "非常に軽い"], explanation: "ホルミウムは非常に強い磁気特性を持つため、強力な磁場を作り出す医療・科学用の実験装置に使われます。" },
            { q: "エルビウム(Er)の性質・特性として正しいものはどれ？", correct: "光ファイバー通信の光を増幅させるアンプに使われる", "水に溶かすと強酸になる", "常温で気体", "磁石にくっつく", "水と激しく反応する"], explanation: "エルビウムを添加した光ファイバーアンプは、海底ケーブルなど長距離の光通信網における信号の増幅に不可欠です。" },
            { q: "ツリウム(Tm)の性質・特性として正しいものはどれ？", correct: "小型のポータブルX線装置の放射線源として使われる", "常温で液体", "金色の貴金属", "水に浮く", "気体の非金属"], explanation: "ツリウムは原子炉等で中子を当てて放射性同位体とすることで、小型軽量なX線撮影装置の線源として利用されます。" },

            let count = 3;
            const updateCount = (val, colorClass = 'text-cyber-accent') => {
                textEl.className = `text-7xl md:text-9xl font-black ${colorClass} tracking-wider drop-shadow-[0_0_25px_rgba(250,204,21,0.8)] animate-countdown`;
                textEl.innerText = val;
                void textEl.offsetWidth; // リフレッシュ
            };

            updateCount(3);
            clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    updateCount(count);
                } else if (count === 0) {
                    updateCount('スタート！', 'text-cyber-green');
                } else {
                    clearInterval(countdownInterval);
                    overlay.classList.add('hidden');
                    callback();
                }
            }, 800);
        }

        function showScreen(screenId) {
            clearInterval(countdownInterval);
            document.getElementById('countdown-overlay').classList.add('hidden');

            const screens = ['top-screen', 'endless-screen', 'test-play-screen', 'result-screen'];
            screens.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');

            if (screenId === 'top-screen') {
                document.getElementById('home-btn').classList.add('hidden');
            } else {
                document.getElementById('home-btn').classList.remove('hidden');
            }
        }

        // 5つのダミーからランダムで2つ選び、正解1つと合わせて計3択（シャッフルして）生成するヘルパー関数
        function generateRandom3Choices(qItem) {
            // ダミーをランダムにシャッフルして2つ取得
            let shuffledDummies = [...qItem.dummies].sort(() => 0.5 - Math.random());
            let selectedDummies = shuffledDummies.slice(0, 2);

            // 正解とダミー2つをまとめる
            let choices = [
                { text: qItem.correct, isCorrect: true },
                { text: selectedDummies[0], isCorrect: false },
                { text: selectedDummies[1], isCorrect: false }
            ];

            // 3つの選択肢の並び順もランダムにシャッフル
            choices.sort(() => 0.5 - Math.random());

            // 正解のインデックス（0, 1, 2のどこにあるか）を特定する
            let correctIndex = choices.findIndex(c => c.isCorrect);

            return {
                options: choices.map(c => c.text),
                answer: correctIndex
            };
        }

        // ==================== エンドレスモード関連 ====================
        let endlessScore = 0;
        let currentEndlessQ = {};
        let currentEndlessAnswerIdx = 0;

        function startEndlessMode() {
            playerName = document.getElementById('player-name').value.trim();
            if (!playerName) {
                alert("プレイヤーのなまえを入力してね！");
                return;
            }
            endlessScore = 0;
            document.getElementById('endless-score').innerText = endlessScore;
            showScreen('endless-screen');

            startCountdown(() => {
                loadNextEndlessQuestion();
            });
        }

        function loadNextEndlessQuestion() {
            document.getElementById('endless-explanation-box').classList.add('hidden');
            
            // 118元素からランダムに1問取得
            let rawQ = elementQuestions[Math.floor(Math.random() * elementQuestions.length)];
            let generated = generateRandom3Choices(rawQ);

            currentEndlessQ = {
                q: rawQ.q,
                options: generated.options,
                answer: generated.answer,
                explanation: rawQ.explanation
            };

            document.getElementById('endless-q-text').innerText = currentEndlessQ.q;

            let html = '';
            currentEndlessQ.options.forEach((opt, i) => {
                html += `<button onclick="checkEndlessAnswer(${i}, ${currentEndlessQ.answer})" class="pop-button w-full text-left p-4 bg-slate-800 hover:bg-slate-700 text-white font-bold text-lg rounded-xl border border-slate-600 flex items-center transition">
                    <span class="bg-cyber-accent text-slate-900 w-8 h-8 rounded-lg flex items-center justify-center font-black mr-4">${i + 1}</span> 
                    <span>${opt}</span>
                </button>`;
            });
            document.getElementById('endless-options').innerHTML = html;
        }

        function checkEndlessAnswer(selectedIndex, correctIndex) {
            const isCorrect = (selectedIndex === correctIndex);
            if (isCorrect) {
                endlessScore++;
                document.getElementById('endless-score').innerText = endlessScore;
            }

            const buttons = document.querySelectorAll('#endless-options button');
            buttons.forEach(btn => btn.disabled = true);

            const badge = document.getElementById('endless-result-badge');
            if (isCorrect) {
                badge.innerHTML = '<span class="text-cyber-green">⭕ せいかい！</span>';
            } else {
                badge.innerHTML = '<span class="text-cyber-pink">❌ ざんねん！不正解</span>';
            }
            document.getElementById('endless-exp-text').innerText = currentEndlessQ.explanation;
            document.getElementById('endless-explanation-box').classList.remove('hidden');
        }

        function nextEndlessQuestion() {
            loadNextEndlessQuestion();
        }

        // ==================== 10問テストモード関連（重複なし） ====================
        let testQuestions = [];
        let testIndex = 0;
        let testScore = 0;
        let userTestAnswers = [];

        function startTestMode() {
            playerName = document.getElementById('player-name').value.trim();
            if (!playerName) {
                alert("プレイヤーのなまえを入力してね！");
                return;
            }

            // 118元素から「重複なし」でランダムに10問を抽出し、それぞれ3択を生成
            let rawSelected = [...elementQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
            testQuestions = rawSelected.map(rawQ => {
                let generated = generateRandom3Choices(rawQ);
                return {
                    q: rawQ.q,
                    options: generated.options,
                    answer: generated.answer,
                    explanation: rawQ.explanation
                };
            });

            testIndex = 0;
            testScore = 0;
            userTestAnswers = [];

            showScreen('test-play-screen');
            showTestQuestion();

            startCountdown(() => {
                // カウントダウン後にスタート
            });
        }

        function showTestQuestion() {
            if (testIndex >= testQuestions.length) {
                showTestResult();
                return;
            }

            document.getElementById('test-q-num').innerText = testIndex + 1;
            let qData = testQuestions[testIndex];
            document.getElementById('test-question-text').innerText = qData.q;

            let container = document.getElementById('test-options-container');
            container.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'pop-button w-full text-left p-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl border border-slate-600 flex items-center transition';
                btn.innerHTML = `<span class="bg-cyber-accent text-slate-900 w-8 h-8 rounded-lg flex items-center justify-center font-black mr-4">${idx + 1}</span> <span class="text-lg">${opt}</span>`;
                btn.onclick = () => checkTestAnswer(idx);
                container.appendChild(btn);
            });
        }

        function checkTestAnswer(selectedIdx) {
            let qData = testQuestions[testIndex];
            let isCorrect = (selectedIdx === qData.answer);
            if (isCorrect) {
                testScore += 10; // 1問10点
            }

            userTestAnswers.push({
                question: qData.q,
                options: qData.options,
                userAnswerIdx: selectedIdx,
                correctIdx: qData.answer,
                isCorrect: isCorrect,
                explanation: qData.explanation
            });

            testIndex++;
            showTestQuestion();
        }

        function showTestResult() {
            showScreen('result-screen');
            document.getElementById('final-score').innerText = `${testScore} 点`;

            let comment = "";
            if (testScore === 100) comment = "👑 完璧です！元素博士の称号を授与します！";
            else if (testScore >= 70) comment = "👏 すごい！元素の性質をよく理解しています！";
            else if (testScore >= 40) comment = "👍 まずまずの成績！解説を読んで苦手を克服しよう！";
            else comment = "💪 もう一度挑戦して満点を目指そう！";
            document.getElementById('final-comment').innerText = comment;

            const container = document.getElementById('test-review-list');
            let html = '';
            userTestAnswers.forEach((item, idx) => {
                let statusBadge = item.isCorrect 
                    ? '<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500 rounded text-xs font-bold">⭕ 正解</span>' 
                    : '<span class="px-2 py-1 bg-pink-500/20 text-pink-400 border border-pink-500 rounded text-xs font-bold">❌ 不正解</span>';
                
                let userAnsText = item.options[item.userAnswerIdx];
                let correctAnsText = item.options[item.correctIdx];

                html += `
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400">第 ${idx + 1} 問 (+10点)</span>
                            ${statusBadge}
                        </div>
                        <p class="text-sm font-bold text-white">${item.question}</p>
                        <div class="text-xs space-y-1 pt-1 border-t border-slate-800">
                            <div class="text-slate-300">あなたの答え：<span class="${item.isCorrect ? 'text-emerald-400 font-bold' : 'text-pink-400 font-bold'}">${userAnsText}</span></div>
                            ${!item.isCorrect ? `<div class="text-cyber-green font-bold">正しい答え：<span>${correctAnsText}</span></div>` : ''}
                            <div class="text-slate-400 pt-1 mt-1 border-t border-slate-900/50 leading-relaxed font-bold">💡 解説：${item.explanation}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
