<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素クイズ テスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl text-center space-y-6 border border-slate-700">
        <h1 class="text-2xl font-black text-yellow-400">🧪 動作確認テスト</h1>
        <p class="text-sm text-slate-300">ボタンが正常に反応するかテストします。</p>
        
        <button onclick="alert('ボタンがクリックされました！JavaScriptは正常に動いています。')" class="w-full py-4 bg-sky-400 hover:bg-sky-300 text-slate-900 font-black text-lg rounded-xl shadow-lg transition transform active:scale-95 cursor-pointer">
            ここを押してテスト
        </button>
    </div>

</body>
</html>
