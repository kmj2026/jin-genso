<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素の性質・特性クイズ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            width: 100%;
            max-width: 42rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1rem;
        }
        main {
            width: 100%;
            max-width: 42rem;
            background-color: #1e293b;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 3px solid #38bdf8;
        }
        h1 { font-size: 1.5rem; font-weight: 900; color: #fde047; margin: 0; text-align: center; }
        h2 { font-size: 1.25rem; font-weight: 900; color: #ffffff; margin-bottom: 1.5rem; text-align: center; }
        .pop-btn {
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 0 #0284c7;
            border: 2px solid #ffffff;
            width: 100%;
            padding: 1.25rem;
            border-radius: 1rem;
            font-weight: 900;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            margin-bottom: 1rem;
        }
        .pop-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #0284c7; }
        .btn-sky { background-color: #38bdf8; color: #0f172a; }
        .btn-purple { background-color: #c084fc; color: #0f172a; box-shadow: 0 4px 0 #9333ea; }
        .btn-purple:active { box-shadow: 0 0 0 #9333ea; }
        .option-btn {
            cursor: pointer;
            touch-action: manipulation;
            width: 100%;
            text-align: left;
            padding: 1rem;
            background-color: #0f172a;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            transition: background-color 0.2s;
            line-height: 1.4;
        }
        .option-btn:hover { background-color: #334155; }
        .opt-badge {
            background-color: #fde047;
            color: #0f172a;
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        .status-box {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .primary-action-btn {
            cursor: pointer;
            width: 100%;
            padding: 1rem;
            background-color: #fde047;
            color: #0f172a;
            font-weight: 900;
            font-size: 1.1rem;
            border-radius: 1rem;
            border: 2px solid #ffffff;
            text-align: center;
            box-shadow: 0 4px 0 #ca8a04;
        }
        .primary-action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #ca8a04; }
        .ranking-card {
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #1e293b;
            font-size: 0.9rem;
        }
        .ranking-item:last-child { border-bottom: none; }
        footer { text-align: center; font-size: 0.75rem; color: #64748b; font-weight: bold; padding-bottom: 0.5rem; }
    </style>
</head>
<body>

    <header>
        <button type="button" onclick="confirmExitToTop()" id="home-btn" style="display: none; padding: 0.5rem 1rem; background-color: #1e293b; color: #fde047; border-radius: 0.75rem; border: 1px solid #fde047; font-weight: bold; font-size: 0.875rem; cursor: pointer;">
            <i class="fa-solid fa-house" style="margin-right: 4px;"></i>トップに戻る
        </button>
        <div style="flex: 1; text-align: center;">
            <h1>🧪 元素クイズ 🧪</h1>
        </div>
        <div style="width: 80px;"></div>
    </header>

    <main>
        <!-- トップメニュー画面 -->
        <div id="top-screen">
            <h2>モードを選んでね！（全118元素対応）</h2>
            
            <!-- プレイヤー名入力エリア（トップ画面に常設） -->
            <div style="background-color: #0f172a; padding: 1.25rem; border-radius: 1rem; border: 1px solid #475569; margin-bottom: 1.5rem; text-align: left;">
                <label style="display: block; font-size: 0.85rem; font-weight: bold; color: #cbd5e1; margin-bottom: 0.5rem;">プレイヤー名を入力してね <span style="color: #f43f5e;">(必須)</span></label>
                <input type="text" id="global-player-name" maxlength="12" placeholder="なまえ（例: 元素博士）" style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #475569; background-color: #1e293b; color: #ffffff; font-weight: bold; font-size: 1rem;">
                <div id="global-name-error" style="color: #f43f5e; font-size: 0.75rem; font-weight: bold; margin-top: 0.5rem; display: none;">⚠️ まず名前を入力してください</div>
            </div>

            <div style="margin-bottom: 2rem;">
                <button type="button" onclick="startEndless()" class="pop-btn btn-sky">
                    <div style="display: flex; align-items: center; gap: 1rem; pointer-events: none;">
                        <i class="fa-solid fa-infinity" style="font-size: 1.8rem;"></i>
                        <div>
                            <div>エンドレスモード</div>
                            <div style="font-size: 0.75rem; font-weight: bold; margin-top: 0.25rem; color: #0f172a;">118元素からランダム！3択クイズ</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="pointer-events: none;"></i>
                </button>

                <button type="button" onclick="startTest()" class="pop-btn btn-purple">
                    <div style="display: flex; align-items: center; gap: 1rem; pointer-events: none;">
                        <i class="fa-solid fa-award" style="font-size: 1.8rem;"></i>
                        <div>
                            <div>10問テストモード</div>
                            <div style="font-size: 0.75rem; font-weight: bold; margin-top: 0.25rem; color: #0f172a;">重複なしで10問！最後に解説レポート</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="pointer-events: none;"></i>
                </button>
            </div>

            <!-- ランキング表示エリア -->
            <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                <div class="ranking-card">
                    <h3 style="font-size: 0.95rem; font-weight: 900; color: #38bdf8; margin: 0 0 0.75rem 0; border-bottom: 2px solid #38bdf8; padding-bottom: 0.25rem;">
                        <i class="fa-solid fa-trophy" style="margin-right: 4px;"></i> エンドレス TOP5（正解率順）
                    </h3>
                    <div id="endless-ranking-list" style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 0.5rem;">読み込み中...</div>
                </div>

                <div class="ranking-card">
                    <h3 style="font-size: 0.95rem; font-weight: 900; color: #c084fc; margin: 0 0 0.75rem 0; border-bottom: 2px solid #c084fc; padding-bottom: 0.25rem;">
                        <i class="fa-solid fa-medal" style="margin-right: 4px;"></i> 10問テスト TOP5（スコア順）
                    </h3>
                    <div id="test-ranking-list" style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 0.5rem;">読み込み中...</div>
                </div>
            </div>
        </div>

        <!-- エンドレスモードプレイ画面 -->
        <div id="endless-screen" style="display: none;">
            <div class="status-box">
                <span style="color: #fde047;"><i class="fa-solid fa-infinity"></i> エンドレス</span>
                <span style="color: #4ade80;">
                    正解: <span id="endless-score">0</span>/<span id="endless-total">0</span>問 
                    (<span id="endless-rate">0%</span>)
                </span>
            </div>

            <div style="background-color: #0f172a; padding: 1.5rem; border-radius: 1rem; border: 1px solid #475569; margin-bottom: 1.5rem;">
                <p id="endless-q-text" style="font-size: 1.1rem; font-weight: bold; margin: 0; line-height: 1.6;"></p>
            </div>

            <div id="endless-options"></div>

            <div id="endless-explanation-box" style="display: none; background-color: #020617; padding: 1.25rem; border-radius: 1rem; border: 2px solid #fde047; margin-top: 1.5rem;">
                <div id="endless-result-badge" style="font-size: 1.2rem; font-weight: 900; margin-bottom: 0.75rem;"></div>
                <p id="endless-exp-text" style="font-size: 0.9rem; color: #e2e8f0; font-weight: bold; margin-bottom: 1rem; line-height: 1.5;"></p>
                <div style="display: flex; gap: 0.75rem;">
                    <button type="button" onclick="loadNextEndlessQuestion()" class="primary-action-btn" style="flex: 1; padding: 0.75rem;">
                        次の問題へ <i class="fa-solid fa-arrow-right" style="margin-left: 4px;"></i>
                    </button>
                    <button type="button" onclick="confirmExitToTop()" style="cursor: pointer; padding: 0.75rem 1.25rem; background-color: #334155; color: #ffffff; font-weight: bold; border-radius: 1.0rem; border: 1px solid #64748b;">
                        Topに戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- テストモードプレイ画面 -->
        <div id="test-play-screen" style="display: none;">
            <div class="status-box">
                <span style="color: #fde047;"><i class="fa-solid fa-award"></i> 10問テスト</span>
                <span style="color: #cbd5e1;">問題 <span id="test-q-num">1</span>/10</span>
            </div>

            <div style="background-color: #0f172a; padding: 1.5rem; border-radius: 1rem; border: 1px solid #475569; margin-bottom: 1.5rem;">
                <p id="test-question-text" style="font-size: 1.1rem; font-weight: bold; margin: 0; line-height: 1.6;"></p>
            </div>

            <div id="test-options-container"></div>
        </div>

        <!-- テスト結果画面 -->
        <div id="result-screen" style="display: none; text-align: center;">
            <h2 style="font-size: 1.5rem; color: #fde047; margin-bottom: 1rem;">🎉 テスト終了！ 🎉</h2>
            <div style="background-color: #0f172a; padding: 1.5rem; border-radius: 1rem; border: 1px solid #475569; margin-bottom: 1.5rem;">
                <p style="color: #94a3b8; font-weight: bold; margin: 0 0 0.5rem 0;">あなたのスコア</p>
                <p id="final-score" style="font-size: 3rem; font-weight: 900; color: #4ade80; margin: 0 0 0.5rem 0;">0 点</p>
                <p id="final-comment" style="font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin: 0;"></p>
            </div>

            <div style="text-align: left; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1rem; font-weight: 900; color: #ffffff; border-bottom: 1px solid #475569; padding-bottom: 0.5rem; margin-bottom: 1rem;">
                    <i class="fa-solid fa-clipboard-list" style="color: #fde047; margin-right: 0.5rem;"></i>こたえあわせ
                </h3>
                <div id="test-review-list" style="max-height: 15rem; overflow-y: auto; padding-right: 0.5rem; display: flex; flex-direction: column; gap: 0.75rem;"></div>
            </div>

            <button type="button" onclick="saveTestRanking()" class="primary-action-btn" id="test-save-btn">
                <i class="fa-solid fa-floppy-disk" style="margin-right: 0.5rem;"></i>ランキングに登録してトップへ
            </button>
        </div>

    </main>

    <footer>
        kmj
    </footer>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw0HvErimWjqXR_oH4180exOjDTVZQssokbVI16Q0P0zraBuHcL6qDW5601gMwvcQJK/exec";

        let elementQuestions = [];
        let currentPlayerName = "";

        // スプレッドシートから問題データを取得
        function fetchQuestions() {
            fetch(GAS_URL + "?action=getQuestions")
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        elementQuestions = data;
                        console.log("問題データ読み込み成功:", elementQuestions.length + "問");
                    } else {
                        console.error("問題データが空です");
                    }
                })
                .catch(err => {
                    console.error("問題データの取得に失敗しました:", err);
                });
        }

        function changeScreen(screenId) {
            const screens = ['top-screen', 'endless-screen', 'test-play-screen', 'result-screen'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
            const target = document.getElementById(screenId);
            if (target) target.style.display = 'block';

            const homeBtn = document.getElementById('home-btn');
            if (screenId === 'top-screen') {
                homeBtn.style.display = 'none';
                fetchRankings();
            } else if (screenId === 'endless-screen' || screenId === 'test-play-screen') {
                homeBtn.style.display = 'block';
            } else {
                homeBtn.style.display = 'none';
            }
        }

        // 名前のバリデーションチェック
        function validatePlayerName() {
            let nameInput = document.getElementById('global-player-name');
            let errorDiv = document.getElementById('global-name-error');
            let name = nameInput.value.trim();

            if (!name) {
                errorDiv.style.display = 'block';
                nameInput.focus();
                return null;
            }
            errorDiv.style.display = 'none';
            return name;
        }

        // 正解（2種類）からランダムに1つ、ダミー（5種類）から短いもの・長いものを交えてランダムに2つ選出する
        function generateRandom3Choices(qItem) {
            let corrects = qItem.corrects || [qItem.corrects];
            let pickedCorrect = corrects[Math.floor(Math.random() * corrects.length)];

            let allDummies = qItem.dummies || [];
            let shortDummies = allDummies.filter(d => d.length < 25);
            let longDummies = allDummies.filter(d => d.length >= 25);

            if (shortDummies.length === 0) shortDummies = allDummies;
            if (longDummies.length === 0) longDummies = allDummies;

            let pickedShort = shortDummies[Math.floor(Math.random() * shortDummies.length)] || "ダミー1";
            let pickedLong = longDummies[Math.floor(Math.random() * longDummies.length)] || "ダミー2";

            if (pickedShort === pickedLong && allDummies.length > 1) {
                let others = allDummies.filter(d => d !== pickedShort);
                pickedLong = others[Math.floor(Math.random() * others.length)];
            }

            let choices = [
                { text: pickedCorrect, isCorrect: true },
                { text: pickedShort, isCorrect: false },
                { text: pickedLong, isCorrect: false }
            ];

            choices.sort(() => 0.5 - Math.random());
            let correctIndex = choices.findIndex(c => c.isCorrect);

            return {
                options: choices.map(c => c.text),
                answer: correctIndex
            };
        }

        // ==================== エンドレスモード ====================
        let endlessScore = 0;
        let endlessTotal = 0;
        let currentEndlessQ = {};

        function startEndless() {
            let name = validatePlayerName();
            if (!name) return;
            currentPlayerName = name;

            if (elementQuestions.length === 0) {
                alert("問題データを読み込み中です。少し待ってからもう一度試してください。");
                fetchQuestions();
                return;
            }
            endlessScore = 0;
            endlessTotal = 0;
            updateEndlessStats();
            changeScreen('endless-screen');
            loadNextEndlessQuestion();
        }

        function updateEndlessStats() {
            document.getElementById('endless-score').innerText = endlessScore;
            document.getElementById('endless-total').innerText = endlessTotal;
            let rate = endlessTotal === 0 ? 0 : Math.round((endlessScore / endlessTotal) * 100);
            document.getElementById('endless-rate').innerText = rate + '%';
        }

        function loadNextEndlessQuestion() {
            document.getElementById('endless-explanation-box').style.display = 'none';
            
            let rawQ = elementQuestions[Math.floor(Math.random() * elementQuestions.length)];
            let generated = generateRandom3Choices(rawQ);

            currentEndlessQ = {
                q: rawQ.q,
                options: generated.options,
                answer: generated.answer,
                explanation: rawQ.explanation
            };

            document.getElementById('endless-q-text').innerText = currentEndlessQ.q;

            let html = '';
            currentEndlessQ.options.forEach((opt, i) => {
                html += `<button type="button" onclick="checkEndlessAnswer(${i}, ${currentEndlessQ.answer})" class="option-btn">
                    <span class="opt-badge">${i + 1}</span> 
                    <span>${opt}</span>
                </button>`;
            });
            document.getElementById('endless-options').innerHTML = html;
        }

        function checkEndlessAnswer(selectedIndex, correctIndex) {
            const isCorrect = (selectedIndex === correctIndex);
            endlessTotal++;
            if (isCorrect) {
                endlessScore++;
            }
            updateEndlessStats();

            const buttons = document.querySelectorAll('#endless-options button');
            buttons.forEach(btn => btn.disabled = true);

            const badge = document.getElementById('endless-result-badge');
            if (isCorrect) {
                badge.innerHTML = '<span style="color: #4ade80;">⭕ せいかい！</span>';
            } else {
                badge.innerHTML = '<span style="color: #f43f5e;">❌ ざんねん！不正解</span>';
            }
            document.getElementById('endless-exp-text').innerText = currentEndlessQ.explanation;
            document.getElementById('endless-explanation-box').style.display = 'block';
        }

        function confirmExitToTop() {
            if (confirm("トップに戻りますか？（プレイ中の成績は保存されません）")) {
                changeScreen('top-screen');
            }
        }

        function saveEndlessRanking() {
            let rate = endlessTotal === 0 ? 0 : Math.round((endlessScore / endlessTotal) * 100);

            let params = new URLSearchParams({
                action: "postScore",
                mode: "endless",
                name: currentPlayerName,
                score: rate,
                total: endlessScore,
                date: new Date().toLocaleDateString()
            });

            fetch(GAS_URL + "?" + params.toString())
                .then(response => response.json())
                .then(data => {
                    changeScreen('top-screen');
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("登録に失敗しました。通信環境を確認してください。");
                });
        }

        // ==================== 10問テストモード ====================
        let testQuestions = [];
        let testIndex = 0;
        let testScore = 0;
        let userTestAnswers = [];

        function startTest() {
            let name = validatePlayerName();
            if (!name) return;
            currentPlayerName = name;

            if (elementQuestions.length === 0) {
                alert("問題データを読み込み中です。少し待ってからもう一度試してください。");
                fetchQuestions();
                return;
            }
            let rawSelected = [...elementQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
            testQuestions = rawSelected.map(rawQ => {
                let generated = generateRandom3Choices(rawQ);
                return {
                    q: rawQ.q,
                    options: generated.options,
                    answer: generated.answer,
                    explanation: rawQ.explanation
                };
            });

            testIndex = 0;
            testScore = 0;
            userTestAnswers = [];

            changeScreen('test-play-screen');
            showTestQuestion();
        }

        function showTestQuestion() {
            if (testIndex >= testQuestions.length) {
                showTestResult();
                return;
            }

            document.getElementById('test-q-num').innerText = testIndex + 1;
            let qData = testQuestions[testIndex];
            document.getElementById('test-question-text').innerText = qData.q;

            let container = document.getElementById('test-options-container');
            container.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-badge">${idx + 1}</span> <span>${opt}</span>`;
                btn.onclick = () => checkTestAnswer(idx);
                container.appendChild(btn);
            });
        }

        function checkTestAnswer(selectedIdx) {
            let qData = testQuestions[testIndex];
            let isCorrect = (selectedIdx === qData.answer);
            if (isCorrect) {
                testScore += 10;
            }

            userTestAnswers.push({
                question: qData.q,
                options: qData.options,
                userAnswerIdx: selectedIdx,
                correctIdx: qData.answer,
                isCorrect: isCorrect,
                explanation: qData.explanation
            });

            testIndex++;
            showTestQuestion();
        }

        function showTestResult() {
            changeScreen('result-screen');
            document.getElementById('final-score').innerText = `${testScore} 点`;

            let comment = "";
            if (testScore === 100) comment = "👑 完璧です！元素博士の称号を授与します！";
            else if (testScore >= 70) comment = "👏 すごい！元素の性質をよく理解しています！";
            else if (testScore >= 40) comment = "👍 まずまずの成績！解説を読んで苦手を克服しよう！";
            else comment = "💪 もう一度挑戦して満点を目指しよう！";
            document.getElementById('final-comment').innerText = comment;

            const container = document.getElementById('test-review-list');
            let html = '';
            userTestAnswers.forEach((item, idx) => {
                let statusBadge = item.isCorrect 
                    ? '<span style="padding: 0.25rem 0.5rem; background-color: rgba(74,222,128,0.2); color: #4ade80; border: 1px solid #4ade80; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold;">⭕ 正解</span>' 
                    : '<span style="padding: 0.25rem 0.5rem; background-color: rgba(244,63,94,0.2); color: #f43f5e; border: 1px solid #f43f5e; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold;">❌ ざんねん</span>';
                
                let userAnsText = item.options[item.userAnswerIdx];
                let correctAnsText = item.options[item.correctIdx];

                html += `
                    <div style="background-color: #020617; padding: 1rem; border-radius: 0.75rem; border: 1px solid #334155; text-align: left;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <span style="font-size: 0.75rem; font-weight: bold; color: #94a3b8;">第 ${idx + 1} 問 (+10点)</span>
                            ${statusBadge}
                        </div>
                        <p style="font-size: 0.85rem; font-weight: bold; color: #ffffff; margin: 0 0 0.5rem 0;">${item.question}</p>
                        <div style="font-size: 0.75rem; border-top: 1px solid #1e293b; padding-top: 0.5rem;">
                            <div style="color: #cbd5e1; margin-bottom: 0.25rem;">あなたの答え：<span style="color: ${item.isCorrect ? '#4ade80' : '#f43f5e'}; font-weight: bold;">${userAnsText}</span></div>
                            ${!item.isCorrect ? `<div style="color: #4ade80; font-weight: bold; margin-bottom: 0.25rem;">正しい答え：<span>${correctAnsText}</span></div>` : ''}
                            <div style="color: #94a3b8; font-weight: bold; margin-top: 0.25rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.25rem; line-height: 1.4;">💡 解説：${item.explanation}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function saveTestRanking() {
            let btn = document.getElementById('test-save-btn');
            btn.innerText = "登録中...";
            btn.disabled = true;

            let params = new URLSearchParams({
                action: "postScore",
                mode: "test",
                name: currentPlayerName,
                score: testScore,
                date: new Date().toLocaleDateString()
            });

            fetch(GAS_URL + "?" + params.toString())
                .then(response => response.json())
                .then(data => {
                    btn.innerText = "ランキングに登録してトップへ";
                    btn.disabled = false;
                    changeScreen('top-screen');
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("登録に失敗しました。通信環境を確認してください。");
                    btn.innerText = "ランキングに登録してトップへ";
                    btn.disabled = false;
                });
        }

        // ==================== ランキング取得・描画 ====================
        function fetchRankings() {
            // エンドレスランキング取得
            fetch(GAS_URL + "?action=getRanking&mode=endless")
                .then(res => res.json())
                .then(data => {
                    let html = '';
                    if (!Array.isArray(data) || data.length === 0) {
                        html = '<div style="color: #64748b; font-size: 0.85rem; text-align: center; padding: 0.5rem;">まだ記録がありません</div>';
                    } else {
                        data.forEach((item, idx) => {
                            let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                            html += `
                                <div class="ranking-item">
                                    <div><span style="font-weight: bold; margin-right: 0.5rem; color: #fde047;">${medal}</span> ${escapeHtml(item.name)}</div>
                                    <div style="font-weight: bold; color: #4ade80;">${item.score}% <span style="font-size: 0.75rem; color: #94a3b8;">(${item.total}問正解)</span></div>
                                </div>
                            `;
                        });
                    }
                    document.getElementById('endless-ranking-list').innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('endless-ranking-list').innerHTML = '<div style="color: #f43f5e; font-size: 0.85rem; text-align: center; padding: 0.5rem;">読み込みエラー</div>';
                });

            // 10問テストランキング取得
            fetch(GAS_URL + "?action=getRanking&mode=test")
                .then(res => res.json())
                .then(data => {
                    let html = '';
                    if (!Array.isArray(data) || data.length === 0) {
                        html = '<div style="color: #64748b; font-size: 0.85rem; text-align: center; padding: 0.5rem;">まだ記録がありません</div>';
                    } else {
                        data.forEach((item, idx) => {
                            let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}.`;
                            html += `
                                ` + `<div class="ranking-item">
                                    <div><span style="font-weight: bold; margin-right: 0.5rem; color: #fde047;">${medal}</span> ${escapeHtml(item.name)}</div>
                                    <div style="font-weight: bold; color: #c084fc;">${item.score} 点</div>
                                </div>`;
                        });
                    }
                    document.getElementById('test-ranking-list').innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('test-ranking-list').innerHTML = '<div style="color: #f43f5e; font-size: 0.85rem; text-align: center; padding: 0.5rem;">読み込みエラー</div>';
                });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, function(match) {
                const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                return escape[match] || match;
            });
        }

        window.onload = function() {
            fetchRankings();
            fetchQuestions(); // 起動時にスプレッドシートから問題データを取得
        };
    </script>
</body>
</html>
