<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仁くん用ブラウザテスト</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#facc15', // Neon Yellow
                            blue: '#38bdf8',   // Neon Blue
                            pink: '#f43f5e',   // Neon Pink
                            green: '#4ade80'   // Neon Green
                        }
                    },
                    fontFamily: {
                        sans: ['"M PLUS Rounded 1c"', 'sans-serif'],
                        teko: ['Teko', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }
        .pop-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 3px solid #38bdf8;
        }
        .pop-button {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #0284c7;
        }
        .pop-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0284c7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <!-- ヘッダー -->
    <header class="w-full max-w-2xl text-center py-4">
        <h1 class="text-4xl md:text-5xl font-black text-cyber-accent tracking-wider drop-shadow-[0_3px_3px_rgba(0,0,0,0.8)]">
            🌟 仁くん用ブラウザテスト 🌟
        </h1>
        <p class="text-sm text-cyber-blue font-bold mt-1">目指せ高得点！全4教科マスターへの道</p>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="w-full max-w-2xl bg-cyber-card rounded-3xl p-6 md:p-8 pop-card mb-6">

        <!-- 1. 教科選択画面 -->
        <div id="menu-screen" class="space-y-6">
            <h2 class="text-2xl font-black text-center text-white mb-4">
                <i class="fa-solid fa-gamepad text-cyber-accent mr-2"></i>チャレンジする教科を選んでね！
            </h2>
            
            <!-- 全教科完了ボタン（一番上に配置） -->
            <div id="all-complete-box" class="hidden mb-6 p-4 bg-cyber-green/20 border-2 border-cyber-green rounded-2xl text-center animate-pulse">
                <p class="text-cyber-green font-black text-lg mb-2">🎉 全教科のチャレンジ完了！すばらしい！ 🎉</p>
                <button onclick="resetAllData()" class="px-6 py-2 bg-cyber-green text-slate-900 font-black rounded-xl hover:bg-emerald-400 text-sm">
                    <i class="fa-solid fa-rotate-right mr-1">V></i>記録をリセットしてもう一度遊ぶ
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="startTest('math')" class="pop-button flex items-center justify-between p-5 bg-sky-500 hover:bg-sky-400 text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                    <span><i class="fa-solid fa-calculator mr-3"></i>算数</span>
                    <span id="score-math" class="text-sm bg-slate-900 text-white px-3 py-1 rounded-full">未挑戦</span>
                </button>
                <button onclick="startTest('japanese')" class="pop-button flex items-center justify-between p-5 bg-pink-500 hover:bg-pink-400 text-white font-black text-xl rounded-2xl border-2 border-white">
                    <span><i class="fa-solid fa-book-open mr-3"></i>国語</span>
                    <span id="score-japanese" class="text-sm bg-slate-900 text-white px-3 py-1 rounded-full">未挑戦</span>
                </button>
                <button onclick="startTest('science')" class="pop-button flex items-center justify-between p-5 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                    <span><i class="fa-solid fa-flask mr-3"></i>理科</span>
                    <span id="score-science" class="text-sm bg-slate-900 text-white px-3 py-1 rounded-full">未挑戦</span>
                </button>
                <button onclick="startTest('social')" class="pop-button flex items-center justify-between p-5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                    <span><i class="fa-solid fa-earth-americas mr-3"></i>社会</span>
                    <span id="score-social" class="text-sm bg-slate-900 text-white px-3 py-1 rounded-full">未挑戦</span>
                </button>
            </div>
        </div>

        <!-- 2. テスト中画面 -->
        <div id="test-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-900/60 p-4 rounded-2xl border border-slate-700">
                <span id="current-subject-title" class="text-xl font-black text-cyber-accent">算数テスト</span>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-bold text-slate-300">問題 <span id="current-q-num">1</span>/10</span>
                    <span id="timer" class="text-2xl font-teko font-bold text-cyber-pink bg-slate-900 px-3 py-1 rounded-xl border border-cyber-pink">15:00</span>
                </div>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 min-h-[120px] flex items-center">
                <p id="question-text" class="text-lg md:text-xl font-bold text-white leading-relaxed">ここに問題文が入ります。</p>
            </div>

            <div id="options-container" class="grid grid-cols-1 gap-3">
                <!-- 選択肢ボタンが動的に入ります -->
            </div>
        </div>

        <!-- 3. 結果発表画面 -->
        <div id="result-screen" class="hidden text-center space-y-6">
            <h2 class="text-3xl font-black text-cyber-accent">🎉 テスト終了！お疲れ様！ 🎉</h2>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 space-y-3">
                <p class="text-slate-400 font-bold">今回の結果</p>
                <p id="result-score" class="text-5xl font-black text-cyber-green">100点</p>
                <p id="result-message" class="text-lg font-bold text-white">よくがんばりました！</p>
            </div>
            <button onclick="returnToMenu()" class="pop-button w-full py-4 bg-cyber-accent text-slate-900 font-black text-xl rounded-2xl border-2 border-white">
                <i class="fa-solid fa-house mr-2"></i>メニューに戻る
            </button>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center text-xs text-slate-500 font-bold pb-2">
        kmj
    </footer>

    <script>
        // ==========================================
        // 各教科 50問のデータベース（サンプル構築：順次拡大可能）
        // ==========================================
        const questionBank = {
            math: [
                { q: "1辺が 6cm の正方形の面積は何平方センチメートル？", options: ["12", "24", "36", "48"], answer: 2 },
                { q: "0.4 × 0.5 の計算結果は？", options: ["0.2", "2", "0.02", "20"], answer: 0 },
                { q: "時速60kmで走る車が、2時間30分に進む道のりは何km？", options: ["120km", "150km", "180km", "200km"], answer: 1 },
                { q: "3/4 と等しい分数は次のうちどれ？", options: ["6/8", "5/8", "4/6", "2/3"], answer: 0 },
                { q: "円周を求める公式で、「直径×〇〇」の〇〇に入る言葉は？", options: ["半径", "円周率", "直径", "面積"], answer: 1 },
                { q: "定価2000円の品物が2割引きのとき、いくらで買える？", options: ["1400円", "1500円", "1600円", "1800円"], answer: 2 },
                { q: "三角形の面積を求める公式は、「底辺×高さ÷〇〇」。〇〇に入る数字は？", options: ["1", "2", "3", "4"], answer: 1 },
                { q: "次のうち、素数（1より大きい整数で、1と自分自身以外に約数を持たない数）はどれ？", options: ["9", "15", "17", "21"], answer: 2 },
                { q: "5Lは何mL？", options: ["50mL", "500mL", "5000mL", "50000mL"], answer: 2 },
                { q: "12の倍数であり、かつ18の倍数でもある最小の数は？（最小公倍数）", options: ["24", "36", "48", "72"], answer: 1 },
                // 11〜50問目の拡張用ストック
                ...Array.from({length: 40}, (_, i) => ({
                    q: `算数の練習問題 第${i+11}問：計算の工夫をしよう。12 + ${i+1} × 2 の答えは？`,
                    options: [`${14 + i}`, `${24 + i*2}`, `${30 + i}`, `${12 + i}`],
                    answer: 1
                }))
            ],
            japanese: [
                { q: "「熟語」の構成として、意味が反対になる漢字の組み合わせはどれ？", options: ["上下", "強弱", "音読", "消去"], answer: 1 },
                { q: "次のうち、ひらがなの「め」の正しい筆順のめすような表現として正しいものは？", options: ["横から書いて縦", "縦から書いて横", "円を描くように"], answer: 0 },
                { q: "「一期一会」の意味として正しいものは？", options: ["何度も会うこと", "一生に一度だけの出会い", "友達と遊ぶこと", "別れを悲しむこと"], answer: 1 },
                { q: "次の漢字「瞬く」の正しい読み方は？", options: ["またたく", "ひらめく", "うるむ", "きらめく"], answer: 0 },
                { q: "文の主語にかかる言葉を何というか？", options: ["述語", "修飾語", "接続語", "独立語"], answer: 1 },
                { q: "「足元をすくわれる」の正しい意味は？", options: ["転んでけがをする", "油断しているところをつけこまれて失敗する", "足が速くなる", "道に迷う"], answer: 1 },
                { q: "次のうち、助詞（て・に・を・は等）はどれ？", options: ["走る", "美しい", "から", "リンゴ"], answer: 2 },
                { q: "「温故知新」の「故」が表しているものは？", options: ["新しいもの", "古いこと・昔の事", "友達", "先生"], answer: 1 },
                { q: "次の四字熟語のうち、「失敗を恐れず何度も挑戦すること」に近いものは？", options: ["七転び八起き", "一石二鳥", "十人十色", "百発百中"], answer: 0 },
                { q: "「彼の意見には賛成しかねる」の「かねる」の意味は？", options: ["〜できる", "〜できない", "迷っている", "喜んでいる"], answer: 1 },
                ...Array.from({length: 40}, (_, i) => ({
                    q: `国語の練習問題 第${i+11}問：「${i+1}」という漢字の部首としてよくあるものは？`,
                    options: ["にんべん", "さんずい", "きへん", "くさかんむり"],
                    answer: i % 4
                }))
            ],
            science: [
                { q: "植物が日光をうけて、二酸化炭素と水から養分と酸素を作るはたらきを何というか？", options: ["呼吸", "蒸散", "光合成", "受粉"], answer: 2 },
                { q: "メダカのめすを見分ける特徴として正しいものは？", options: ["背びれに切れ込みがある", "尻びれに切れ込みがある", "尻びれが四角い", "しっぽが長い"], answer: 1 },
                { q: "月が満ち欠けして見える原因はどれ？", options: ["地球が自転しているから", "太陽と月と地球の位置関係が変わるから", "月自身が形を変えているから", "雲がかかるから"], answer: 1 },
                { q: "水溶液の性質で、リトマス紙を青色から赤色に変えるものはどれ？", options: ["酸性", "中性", "アルカリ性", "塩基性"], answer: 0 },
                { q: "てこが水平につりあうとき、「おもりの重さ×支点からのきょじょう」の左右はどのような関係にある？", options: ["等しい", "足すと10になる", "大きい方が勝つ", "関係ない"], answer: 0 },
                { q: "人の体の血液を全身に送り出すポンプの役割をする臓器は？", options: ["肺", "胃", "心臓", "肝臓"], answer: 2 },
                { q: "空気中でものを燃やす働きがある気体はどれ？", options: ["窒素", "二酸化炭素", "酸素", "ヘリウム"], answer: 2 },
                { q: "台風の進む向きは、日本付近ではふつうどちらの方角へ進む？", options: ["北から南", "西から東（北東へ）", "東から西", "南から北西"], answer: 1 },
                { q: "食物連鎖のピラミッドで、一番下の土台（生産者）になることが多いものは？", options: ["植物", "草食動物", "肉食動物", "分解者"], answer: 0 },
                { q: "水が沸騰しているとき、発生しているあわの正体は何？", options: ["空気", "水蒸気", "二酸化炭素", "水素"], answer: 1 },
                ...Array.from({length: 40}, (_, i) => ({
                    q: `理科の練習問題 第${i+11}問：てこや力の実験${i+1}についての問題です。支点から力点までの距離を2倍にすると、おもりの重さはどうなる？`,
                    options: ["半分で済む", "2倍必要", "変わらない", "4倍になる"],
                    answer: 0
                }))
            ],
            social: [
                { q: "日本国憲法に定められている「国民の三大義務」に含まれないものは？", options: ["教育の義務", "勤労の義務", "納税の義務", "投票の義務"], answer: 3 },
                { q: "鎌倉幕府を開いた人物は誰？", options: ["源頼朝", "源義経", "足利尊氏", "織田信長"], answer: 0 },
                { q: "沖縄県で、かつて栄えた独自の王国の名前は？", options: ["大和王国", "琉球王国", "蝦夷共和国", "邪馬台国"], answer: 1 },
                { q: "日本の国土のうち、最も面積が大きい都道府県はどこ？", options: ["岩手県", "福島県", "北海道", "長野県"], answer: 2 },
                { q: "工業地帯のうち、京浜工業地帯に含まれる都道府県はどれ？", options: ["東京都・神奈川県", "大阪府・兵庫県", "愛知県・岐阜県", "福岡県・山口県"], answer: 0 },
                { q: "縄文時代に使われていた、低温で焼かれた土器の名前は？", options: ["弥生土器", "縄文土器", "須恵器", "埴輪"], answer: 1 },
                { q: "日本のまわりにある海のうち、北側に位置する海はどれ？", options: ["太平洋", "日本海", "東シナ海", "オホーツク海"], answer: 3 },
                { q: "室町時代に建てられた、金箔がはられた金閣寺がある都市はどこ？", options: ["奈良県", "京都府", "鎌倉市", "東京都"], answer: 1 },
                { q: "国会で話し合われた法律案を最終的に決定（成立）させるのはどこ？", options: ["内閣", "裁判所", "国会", "警察庁"], answer: 2 },
                { q: "日本の伝統的な産業のうち、伝統工芸品として知られるものはどれ？", options: ["自動車づくり", "清水焼（陶磁器）", "パソコン組立", "ロケット製造"], answer: 1 },
                ...Array.from({length: 40}, (_, i) => ({
                    q: `社会の練習問題 第${i+11}問：歴史や地理に関する確認問題${i+1}。日本の歴史上の出来事について正しいものを選ぼう。`,
                    options: ["選択肢A", "選択肢B", "選択肢C", "選択肢D"],
                    answer: i % 4
                }))
            ]
        };

        let currentSubject = '';
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 900; // 15分 (15 * 60秒)
        let userScores = { math: null, japanese: null, science: null, social: null };

        // 配列をランダムにシャッフルして重複なしで指定数を取り出す関数（Fisher-Yatesアルゴリズム）
        function getRandomQuestions(array, count) {
            let shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function startTest(subject) {
            currentSubject = subject;
            // 50問ストックの中からランダムで10問を重複なしで抽出
            currentQuestions = getRandomQuestions(questionBank[subject], 10);
            currentIndex = 0;
            score = 0;
            timeLeft = 900;

            // 画面切り替え
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            const titles = { math: '算数テスト', japanese: '国語テスト', science: '理科テスト', social: '社会テスト' };
            document.getElementById('current-subject-title').innerText = titles[subject];

            startTimer();
            showQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endTest();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function showQuestion() {
            if (currentIndex >= currentQuestions.length) {
                endTest();
                return;
            }

            document.getElementById('current-q-num').innerText = currentIndex + 1;
            let qData = currentQuestions[currentIndex];
            document.getElementById('question-text').innerText = qData.q;

            let optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'pop-button w-full text-left p-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl border border-slate-600 flex items-center transition';
                btn.innerHTML = `<span class="bg-cyber-accent text-slate-900 w-8 h-8 rounded-lg flex items-center justify-center font-black mr-4">${idx + 1}</span> <span class="text-lg">${opt}</span>`;
                btn.onclick = () => checkAnswer(idx);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx) {
            let qData = currentQuestions[currentIndex];
            if (selectedIdx === qData.answer) {
                score += 10; // 10問なので1問正解につき10点（合計100点満点）
            }
            currentIndex++;
            showQuestion();
        }

        function endTest() {
            clearInterval(timerInterval);
            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('result-score').innerText = `${score}点`;
            
            let msg = "よくがんばりました！";
            if (score === 100) msg = "✨ 満点すごい！パーフェクトマスター！ ✨";
            else if (score >= 80) msg = "🌟 おしい！あと少しで満点だったよ！";
            else if (score >= 60) msg = "👍 よくできました！この調子！";
            document.getElementById('result-message').innerText = msg;

            // スコアを保存
            userScores[currentSubject] = score;
            updateMenuUI();
        }

        function updateMenuUI() {
            for (let sub in userScores) {
                let badge = document.getElementById(`score-${sub}`);
                if (userScores[sub] !== null) {
                    badge.innerText = `${userScores[sub]}点`;
                    badge.className = "text-sm bg-cyber-accent text-slate-900 font-black px-3 py-1 rounded-full";
                }
            }

            // 全教科完了チェック
            let allCompleted = Object.values(userScores).every(val => val !== null);
            if (allCompleted) {
                document.getElementById('all-complete-box').classList.remove('hidden');
            }
        }

        function returnToMenu() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function resetAllData() {
            userScores = { math: null, japanese: null, science: null, social: null };
            document.getElementById('all-complete-box').classList.add('hidden');
            ['math', 'japanese', 'science', 'social'].forEach(sub => {
                let badge = document.getElementById(`score-${sub}`);
                badge.innerText = "未挑戦";
                badge.className = "text-sm bg-slate-900 text-white px-3 py-1 rounded-full";
            });
        }
    </script>
</body>
</html>
